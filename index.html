<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>सेवा हाज़री जत्था सिकन्दरपुर</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#17202a;font-family:Arial,"Noto Sans Devanagari",sans-serif}
header{background:#16733b;color:#fff;text-align:center;padding:18px 10px;font-size:28px;font-weight:700}
.wrap{max-width:720px;margin:30px auto;padding:0 16px}.card{background:#fff;border-radius:22px;padding:26px 18px;box-shadow:0 4px 18px #0001;margin-bottom:18px}
h2{font-size:27px;margin:0 0 22px}.search{display:flex;gap:10px}input{flex:1;min-width:0;padding:16px;border:1px solid #c8cfd5;border-radius:14px;font-size:18px;text-transform:uppercase}button{background:#16733b;color:#fff;border:0;border-radius:14px;padding:0 28px;font-size:18px;font-weight:700}
.msg{text-align:center;margin-top:14px;color:#69727c;font-size:17px}.error{color:#a52218;background:#fff2f0;padding:12px;border-radius:12px}
h3{font-size:27px;margin:0 0 15px}.line{font-size:18px;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.stat{border:1px solid #e1e5e8;border-radius:16px;padding:18px;text-align:center;background:#fafafa}.stat span{display:block;font-size:18px;margin-bottom:8px}.stat b{font-size:27px}
@media(max-width:560px){header{font-size:24px}.search{display:block}button{width:100%;height:58px;margin-top:10px}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>🙏 सेवा हाज़री जत्था सिकन्दरपुर</header>
<div class="wrap">
<div class="card">
<h2>🔎 अपने बैज नं से हाज़री खोजें</h2>
<div class="search"><input id="badge" placeholder="SI5860LA0000 / SI5860GA0000 / SKP00000" autocomplete="off"><button onclick="search()">Search</button></div>
<div id="msg" class="msg"></div>
</div>
<div id="result"></div>
</div>
<script>
let records=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const norm=v=>String(v??"").trim().toUpperCase().replace(/\s+/g,"");
async function load(){
 try{
  const r=await fetch("data.json?v="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw 0;
  records=await r.json();
  document.querySelector("#msg").textContent="कृपया अपना बैज नं डालकर Search करें।";
 }catch(e){
  document.querySelector("#msg").innerHTML='<div class="error">❌ Attendance data लोड नहीं हुआ।</div>';
 }
}
function search(){
 const q=norm(document.querySelector("#badge").value), out=document.querySelector("#result"), msg=document.querySelector("#msg");
 if(!q){msg.textContent="कृपया अपना बैज नं डालकर Search करें।";out.innerHTML="";return}
 const x=records.find(r=>norm(r.badge)===q);
 if(!x){msg.textContent="❌ इस बैज नं की हाज़री नहीं मिली।";out.innerHTML="";return}
 msg.textContent="✅ रिकॉर्ड मिल गया।";
 out.innerHTML=`<div class="card"><h3>${esc(x.name)}</h3>
 <div class="line"><b>बैज नं:</b> ${esc(x.badge)}</div>
 <div class="line"><b>पिता/पति का नाम:</b> ${esc(x.father)}</div>
 <div class="stats">
 <div class="stat"><span>☀️ दिन</span><b>${esc(x.day)}</b></div>
 <div class="stat"><span>🌙 रात</span><b>${esc(x.night)}</b></div>
 <div class="stat"><span>शनिवार</span><b>${esc(x.saturday)}</b></div>
 <div class="stat"><span>रविवार</span><b>${esc(x.sunday)}</b></div>
 <div class="stat"><span>लिपाई</span><b>${esc(x.lipai)}</b></div>
 <div class="stat"><span>ब्यास व अन्य</span><b>${esc(x.beas)}</b></div>
 </div></div>`;
}
document.querySelector("#badge").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
load();
</script>
</body></html>
