<script>
/* ==============================
   GOOGLE SHEET WEB_DATA API
   ============================== */

const API_URL = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

const UPDATED = 'Last Updated on September 18, 2026';

let records = null;
const app = document.getElementById('app');

const esc = v =>
  String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

const norm = v =>
  String(v ?? '').trim().toUpperCase().replace(/\s+/g,'');


/* ==============================
   LAST 5 SEARCHED BADGE IDS
   ============================== */

function getRecent(){
  try{
    return JSON.parse(
      localStorage.getItem('sewaHazriRecent') || '[]'
    );
  }catch{
    return [];
  }
}

function saveRecent(id){
  let a = getRecent().filter(x => x !== id);
  a.unshift(id);
  localStorage.setItem(
    'sewaHazriRecent',
    JSON.stringify(a.slice(0,5))
  );
}


/* ==============================
   GOOGLE SHEET DATA
   ============================== */

async function load(){

  if(records) return records;

  const url =
    API_URL +
    (API_URL.includes('?') ? '&' : '?') +
    'action=all&_=' +
    Date.now();

  const r = await fetch(url,{
    cache:'no-store'
  });

  if(!r.ok){
    throw Error('API_ERROR');
  }

  const result = await r.json();

  /*
     API can return:
     {found:true,data:{...}}
     OR
     {data:[...]}
     OR
     [...]
  */

  if(Array.isArray(result)){
    records = result;
    return records;
  }

  if(Array.isArray(result.data)){
    records = result.data;
    return records;
  }

  if(result.data && typeof result.data === 'object'){
    records = [result.data];
    return records;
  }

  records = [];
  return records;
}


/* ==============================
   FOOTER
   ============================== */

function footer(){
  return `
    <footer class="footer">
      Contact No.: +91 93156 64443
    </footer>
  `;
}


/* ==============================
   SEARCH PAGE
   ============================== */

function searchPage(prefill=''){

  app.innerHTML = `
  <div class="page search-page">

    <div class="top">

      <img
        class="top-logo"
        src="rs-sb-logo.png"
        alt="RS SB"
      >

      <div class="title">
        Sewadar Information Portal
      </div>

      <div class="subtitle">
        सिकन्दरपुर
      </div>

    </div>

    <main class="content">

      <div class="search-box">

        <span class="search-icon">⌕</span>

        <input
          id="badgeInput"
          class="search-input"
          autocomplete="off"
          spellcheck="false"
          placeholder="Badge ID"
          value="${esc(prefill)}"
        >

        <button
          id="clearBtn"
          class="clear"
          aria-label="Clear"
        >
          ×
        </button>

      </div>

      <button
        id="searchBtn"
        class="search-btn"
      >
        Check attendance
      </button>

      <div
        id="status"
        class="status"
      ></div>

      <div class="recent-wrap">

        <div
          id="recent"
          class="recent"
        ></div>

      </div>

    </main>

    ${footer()}

  </div>
  `;


  const input =
    document.getElementById('badgeInput');

  const clear =
    document.getElementById('clearBtn');


  function sync(){

    input.value =
      input.value.toUpperCase();

    clear.classList.toggle(
      'show',
      !!input.value
    );

  }


  input.addEventListener(
    'input',
    sync
  );

  sync();

  input.focus();


  document
    .getElementById('searchBtn')
    .onclick = () => doSearch(input.value);


  input.addEventListener(
    'keydown',
    e => {
      if(e.key === 'Enter'){
        doSearch(input.value);
      }
    }
  );


  clear.onclick = () => {

    input.value = '';

    sync();

    input.focus();

  };


  renderRecent();

}


/* ==============================
   RECENT SEARCHES
   ============================== */

function renderRecent(){

  const el =
    document.getElementById('recent');

  const a = getRecent();

  el.innerHTML =
    a.map(id => `
      <button
        type="button"
        data-id="${esc(id)}"
      >
        ${esc(id)}
      </button>
    `).join('');


  el
    .querySelectorAll('button')
    .forEach(b => {

      b.onclick = () =>
        doSearch(b.dataset.id);

    });

}


/* ==============================
   SEARCH BADGE
   ============================== */

async function doSearch(raw){

  const id = norm(raw);

  const status =
    document.getElementById('status');


  if(!id){

    status.textContent =
      'Please enter Badge ID.';

    status.className =
      'status err';

    return;

  }


  status.textContent =
    '';


  try{

    /*
      Google Sheet से fresh data
      हर search पर लिया जाएगा
    */

    records = null;

    const data =
      await load();


    const rec =
      data.find(
        x => norm(
          x.badge ??
          x.Badge ??
          x['Badge ID']
        ) === id
      );


    if(!rec){

      status.textContent =
        'This Badge ID was not found.';

      status.className =
        'status err';

      return;

    }


    saveRecent(id);


    history.pushState(
      {badge:id},
      '',
      location.pathname +
      '?badge=' +
      encodeURIComponent(id)
    );


    resultPage(rec);


  }catch(e){

    console.error(e);

    status.textContent =
      'Attendance data could not be loaded.';

    status.className =
      'status err';

  }

}


/* ==============================
   RESULT PAGE
   ============================== */

function resultPage(rec){

  const badge =
    rec.badge ??
    rec.Badge ??
    rec['Badge ID'] ??
    '';

  const name =
    rec.name ??
    rec.Name ??
    '';

  const parent =
    rec.parent ??
    rec.Parent ??
    rec['Father/Husband'] ??
    rec['Father/Husband Name'] ??
    '';


  const day =
    rec.day ??
    rec.Day ??
    0;

  const night =
    rec.night ??
    rec.Night ??
    0;

  const saturday =
    rec.saturday ??
    rec.Saturday ??
    0;

  const sunday =
    rec.sunday ??
    rec.Sunday ??
    0;

  const lipai =
    rec.lipai ??
    rec.Lipai ??
    0;

  const beas =
    rec.beas ??
    rec.Beas ??
    0;


  app.innerHTML = `

  <div class="page result-page">

    <div class="watermark"></div>


    <div class="result-top">

      <button
        class="back"
        id="back"
      >
        <span>‹</span>Back
      </button>


      <div class="identity">

        <div class="badge">
          ${esc(badge)}
        </div>

        <div class="person-name">
          ${esc(name)}
        </div>

        <div class="parent-name">
          ${esc(parent)}
        </div>

      </div>

    </div>


    <section class="summary">

      <h2>
        आपकी हाज़री
      </h2>


      <div class="grid">

        <div class="cell">
          <div class="label">दिन</div>
          <div class="value">${esc(day)}</div>
        </div>


        <div class="cell">
          <div class="label">रात</div>
          <div class="value">${esc(night)}</div>
        </div>


        <div class="cell">
          <div class="label">शनिवार</div>
          <div class="value">${esc(saturday)}</div>
        </div>


        <div class="cell">
          <div class="label">रविवार</div>
          <div class="value">${esc(sunday)}</div>
        </div>


        <div class="cell">
          <div class="label">लिपाई</div>
          <div class="value">${esc(lipai)}</div>
        </div>


        <div class="cell">
          <div class="label">ब्यास व अन्य</div>
          <div class="value">${esc(beas)}</div>
        </div>

      </div>

    </section>


    <div class="updated">

      <span class="calendar">▣</span>

      ${UPDATED}

    </div>


    ${footer()}

  </div>
  `;


  document
    .getElementById('back')
    .onclick = () => {

      history.pushState(
        {},
        '',
        location.pathname
      );

      searchPage(badge);

    };

}


/* ==============================
   OPEN DIRECT BADGE URL
   ============================== */

async function boot(){

  const q =
    new URLSearchParams(
      location.search
    ).get('badge');


  if(q){

    try{

      records = null;

      const data =
        await load();


      const rec =
        data.find(
          x =>
            norm(
              x.badge ??
              x.Badge ??
              x['Badge ID']
            ) === norm(q)
        );


      if(rec){

        resultPage(rec);

        return;

      }

    }catch(e){

      console.error(e);

    }

  }


  searchPage(q || '');

}


/* ==============================
   BROWSER BACK/FORWARD
   ============================== */

window.addEventListener(
  'popstate',
  boot
);


boot();

</script>
