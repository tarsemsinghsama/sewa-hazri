<html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sewadar Information Portal</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f4e8;
  color:#333;
}

body{
  min-height:100vh;
}

button,
input{
  font-family:inherit;
}

.page{
  min-height:100vh;
  width:100%;
  position:relative;
  overflow:hidden;
}

/* ==============================
   SEARCH PAGE
   ============================== */

.search-page{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background:
    linear-gradient(
      180deg,
      #fbf8eb 0%,
      #f7f4e8 100%
    );
}

.top{
  text-align:center;
  padding-top:28px;
}

.top-logo{
  width:82px;
  height:82px;
  object-fit:contain;
  display:block;
  margin:0 auto 12px;
}

.title{
  font-size:25px;
  font-weight:700;
  color:#5c1720;
  letter-spacing:.2px;
}

.subtitle{
  margin-top:6px;
  font-size:20px;
  font-weight:600;
  color:#555;
}

.content{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:42px 22px 25px;
  flex:1;
}

.search-box{
  position:relative;
  width:100%;
}

.search-input{
  width:100%;
  height:58px;
  border:1px solid #cfc9b8;
  border-radius:15px;
  background:#fff;
  padding:0 52px 0 48px;
  font-size:18px;
  outline:none;
  color:#333;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.search-input:focus{
  border-color:#751d29;
  box-shadow:
    0 0 0 3px rgba(117,29,41,.10),
    0 3px 12px rgba(0,0,0,.06);
}

.search-icon{
  position:absolute;
  left:17px;
  top:50%;
  transform:translateY(-50%);
  font-size:28px;
  color:#777;
  z-index:2;
}

.clear{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:transparent;
  color:#777;
  font-size:27px;
  display:none;
  cursor:pointer;
}

.clear.show{
  display:block;
}

.search-btn{
  width:100%;
  height:56px;
  margin-top:18px;
  border:none;
  border-radius:15px;
  background:#641b25;
  color:#fff;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(100,27,37,.18);
}

.search-btn:active{
  transform:translateY(1px);
}

.status{
  min-height:26px;
  text-align:center;
  margin-top:15px;
  font-size:15px;
}

.status.err{
  color:#a52222;
}

.recent-wrap{
  margin-top:15px;
}

.recent{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.recent button{
  border:1px solid #d1c5bb;
  background:#fff;
  color:#641b25;
  padding:8px 13px;
  border-radius:20px;
  font-size:14px;
  cursor:pointer;
}

/* ==============================
   FOOTER #641b25
   ============================== */

footer::before, footer::after {
    content: "";
    display: inline-block;
    vertical-align: middle;
    width: 68px;
    height: 1px;
    color:#641b25;
    background: currentColor;
    margin: 0 18px 3px;
}

/* ==============================
   RESULT PAGE
   ============================== */

.result-page{
  min-height:100vh;
  width:100%;
  position:relative;
  display:flex;
  flex-direction:column;
  background:#f7f4e8;
  padding-bottom:0;
}

.watermark{
  position:absolute;
  left:50%;
  top:30%;
  transform:translate(-50%,-50%);
  width:330px;
  height:330px;
  background-image:url("rs-sb-logo.png");
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
  opacity:.20;
  pointer-events:none;
}

.result-top{
  position:relative;
  z-index:2;
  padding:20px 20px 0;
}

.back{
  border:none;
  background:transparent;
  color:#641b25;
  font-size:16px;
  padding:5px 0;
  cursor:pointer;
}

.back span{
  font-size:27px;
  vertical-align:-2px;
  margin-right:3px;
}

.identity{
  text-align:center;
  margin-top:8px;
}

.badge{
  font-size:15px;
  color:#777;
  font-weight:600;
  letter-spacing:.5px;
}

.person-name{
  margin-top:8px;
  font-size:25px;
  font-weight:700;
  color:#641b25;
}

.parent-name{
  margin-top:5px;
  font-size:14px;
  color:#777;
  font-weight:400;
}

.summary{
  position:relative;
  z-index:2;
  width:calc(100% - 30px);
  max-width:520px;
  margin:30px auto 0;
  padding:24px 18px 26px;
  border-radius:20px;
  background:rgba(255,255,255,.76);
  border:1px solid rgba(120,100,90,.14);
  box-shadow:0 7px 25px rgba(0,0,0,.07);
  backdrop-filter:blur(1px);
}

.summary h2{
  text-align:center;
  margin:0 0 23px;
  color:#641b25;
  font-size:22px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  border:1px solid #ddd5c9;
  border-radius:13px;
  overflow:hidden;
  background:rgba(255,255,255,.65);
}

.cell{
  min-height:92px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border-right:1px solid #ddd5c9;
  border-bottom:1px solid #ddd5c9;
}

.cell:nth-child(2n){
  border-right:none;
}

.cell:nth-last-child(-n+2){
  border-bottom:none;
}

.label{
  font-size:14px;
  color:#666;
  font-weight:700;
  letter-spacing:.3px;
}

.value{
  margin-top:8px;
  font-size:27px;
  font-weight:700;
  color:#641b25;
}

.updated{
  position:relative;
  z-index:2;
  text-align:center;
  margin:19px 10px 0;
  color:#777;
  font-size:12px;
}

.calendar{
  margin-right:4px;
}

.result-page .footer{
  position:relative;
  z-index:2;
  margin-top:auto;
  padding:18px 12px 20px;
}
footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 10;
    text-align: center;
    padding: 12px 12px 24px;
    color: var(--maroon);
    font-size: 15px;
    font-weight: 650;
    opacity: .72;
    background-color: #f4f6f8; /* 👈 yahan apne page ka background color de dein taaki piche ka text na dikhe */
}

footer::before, footer::after {
    content: "";
    display: inline-block;
    vertical-align: middle;
    width: 68px;
    height: 1px;
    background: currentColor;
    margin: 0 18px 3px;
}

      
/* ==============================
   SMALL MOBILE
   ============================== */

@media(max-width:380px){

  .top{
    padding-top:20px;
  }

  .top-logo{
    width:70px;
    height:70px;
  }

  .title{
    font-size:22px;
  }

  .subtitle{
    font-size:18px;
  }

  .content{
    padding-top:32px;
  }

  .person-name{
    font-size:22px;
  }

  .summary{
    margin-top:24px;
  }

}

</style>
</head>


<body>

<div id="app"></div>


<script>

/* ==============================
   GOOGLE SHEET WEB_DATA API
   ============================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbyd4As99hfyRgTQgkNnhUMAZxTI4diK93TD8IvdJmiRNXRinq_YtAN24wEnW1Vts7jb/exec';

const UPDATED =
'Last Updated on 22 September, 2026';


const app =
document.getElementById('app');


/* ==============================
   HELPER
   ============================== */

const esc = v =>
  String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));


const norm = v =>
  String(v ?? '')
    .trim()
    .toUpperCase()
    .replace(/\s+/g,'');


/* ==============================
   LAST 5 SEARCHED BADGE IDS
   ============================== */

function getRecent(){

  try{

    return JSON.parse(
      localStorage.getItem('sewaHazriRecent') || '[]'
    );

  }catch(e){

    return [];

  }

}


function saveRecent(id){

  let a =
    getRecent().filter(x => x !== id);

  a.unshift(id);

  localStorage.setItem(
    'sewaHazriRecent',
    JSON.stringify(a.slice(0,5))
  );

}


/* ==============================
   GET ONE BADGE DATA
   ============================== */

async function getBadgeData(id){

  const url =
    API_URL +
    '?badge=' +
    encodeURIComponent(id) +
    '&_=' +
    Date.now();


  const response =
    await fetch(
      url,
      {
        method:'GET',
        cache:'no-store'
      }
    );


  if(!response.ok){

    throw new Error('API_ERROR');

  }


  const result =
    await response.json();


  /*
     Expected response:

     {
       found:true,
       data:{
         badge:"ABC123",
         name:"Name",
         parent:"Father",
         day:10,
         night:5,
         saturday:1,
         sunday:2,
         lipai:0,
         beas:4
       }
     }
  */


  if(
    result &&
    result.found === true &&
    result.data
  ){

    return result.data;

  }


  return null;

}


/* ==============================
   FOOTER
   ============================== */

function footer(){

  return `
    <footer class="footer">
      Contact No.: +91 93156 64443
    </footer>
  `;

}


/* ==============================
   SEARCH PAGE
   ============================== */

function searchPage(prefill=''){

  app.innerHTML = `

  <div class="page search-page">

    <div class="top">

      <img
        class="top-logo"
        src="rs-sb-logo.png"
        alt="RS SB"
      >

      <div class="title">
        Sewadar Information Portal
      </div>

      <div class="subtitle">
        सिकन्दरपुर
      </div>

    </div>


    <main class="content">

      <div class="search-box">

        <span class="search-icon">
          ⌕
        </span>

        <input
          id="badgeInput"
          class="search-input"
          autocomplete="off"
          spellcheck="false"
          placeholder="Badge ID"
          value="${esc(prefill)}"
        >

        <button
          id="clearBtn"
          class="clear"
          aria-label="Clear"
        >
          ×
        </button>

      </div>


      <button
        id="searchBtn"
        class="search-btn"
      >
        Check attendance
      </button>


      <div
        id="status"
        class="status"
      ></div>


      <div class="recent-wrap">

        <div
          id="recent"
          class="recent"
        ></div>

      </div>

    </main>


    ${footer()}

  </div>

  `;


  const input =
    document.getElementById('badgeInput');


  const clear =
    document.getElementById('clearBtn');


  function sync(){

    input.value =
      input.value.toUpperCase();


    clear.classList.toggle(
      'show',
      !!input.value
    );

  }


  input.addEventListener(
    'input',
    sync
  );


  sync();


  document
    .getElementById('searchBtn')
    .onclick = () =>
      doSearch(input.value);


  input.addEventListener(
    'keydown',
    e => {

      if(e.key === 'Enter'){

        doSearch(input.value);

      }

    }
  );


  clear.onclick = () => {

    input.value = '';

    sync();

    input.focus();

  };


  renderRecent();

}


/* ==============================
   RECENT SEARCHES
   ============================== */

function renderRecent(){

  const el =
    document.getElementById('recent');


  if(!el) return;


  const a =
    getRecent();


  el.innerHTML =
    a.map(id => `

      <button
        type="button"
        data-id="${esc(id)}"
      >
        ${esc(id)}
      </button>

    `).join('');


  el
    .querySelectorAll('button')
    .forEach(button => {

      button.onclick = () =>
        doSearch(
          button.dataset.id
        );

    });

}


/* ==============================
   SEARCH BADGE
   ============================== */

async function doSearch(raw){

  const id =
    norm(raw);


  const status =
    document.getElementById('status');


  if(!id){

    status.textContent =
      'Please enter Badge ID.';

    status.className =
      'status err';

    return;

  }


  status.textContent =
    'Loading...';

  status.className =
    'status';


  try{

    /*
       अब पूरी Excel/Sheet load नहीं होगी।

       केवल उसी Badge ID का record
       Google Apps Script से लिया जाएगा।
    */


    const rec =
      await getBadgeData(id);


    if(!rec){

      status.textContent =
        'This Badge ID was not found.';

      status.className =
        'status err';

      return;

    }


    saveRecent(id);


    history.pushState(
      {badge:id},
      '',
      location.pathname +
      '?badge=' +
      encodeURIComponent(id)
    );


    resultPage(rec);


  }catch(error){

    console.error(error);


    status.textContent =
      'Attendance data could not be loaded.';

    status.className =
      'status err';

  }

}


/* ==============================
   RESULT PAGE
   ============================== */

function resultPage(rec){

  const badge =
    rec.badge ??
    rec.Badge ??
    rec['Badge ID'] ??
    '';


  const name =
    rec.name ??
    rec.Name ??
    '';


  const parent =
    rec.parent ??
    rec.Parent ??
    rec['Father/Husband'] ??
    rec['Father/Husband Name'] ??
    '';


  const day =
    rec.day ??
    rec.Day ??
    0;


  const night =
    rec.night ??
    rec.Night ??
    0;


  const saturday =
    rec.saturday ??
    rec.Saturday ??
    0;


  const sunday =
    rec.sunday ??
    rec.Sunday ??
    0;


  const lipai =
    rec.lipai ??
    rec.Lipai ??
    0;


  const beas =
    rec.beas ??
    rec.Beas ??
    0;


  app.innerHTML = `

  <div class="page result-page">

    <div class="watermark"></div>


    <div class="result-top">

      <button
        class="back"
        id="back"
      >
        <span>‹</span>
        Back
      </button>


      <div class="identity">

        <div class="badge">
          ${esc(badge)}
        </div>


        <div class="person-name">
          ${esc(name)}
        </div>


        <div class="parent-name">
          ${esc(parent)}
        </div>

      </div>

    </div>


    <section class="summary">

      <h2>
        आपकी हाजरी
      </h2>


      <div class="grid">


        <div class="cell">

          <div class="label">
            दिन
          </div>

          <div class="value">
            ${esc(day)}
          </div>

        </div>


        <div class="cell">

          <div class="label">
            रात
          </div>

          <div class="value">
            ${esc(night)}
          </div>

        </div>


        <div class="cell">

          <div class="label">
            शनिवार
          </div>

          <div class="value">
            ${esc(saturday)}
          </div>

        </div>


        <div class="cell">

          <div class="label">
            रविवार
          </div>

          <div class="value">
            ${esc(sunday)}
          </div>

        </div>


        <div class="cell">

          <div class="label">
            लिपाई
          </div>

          <div class="value">
            ${esc(lipai)}
          </div>

        </div>


        <div class="cell">

          <div class="label">
            ब्यास व अन्य
          </div>

          <div class="value">
            ${esc(beas)}
          </div>

        </div>


      </div>

    </section>


    <div class="updated">

      <span class="calendar">
        ▣
      </span>

      ${UPDATED}

    </div>


    ${footer()}

  </div>

  `;


  document
    .getElementById('back')
    .onclick = () => {

      history.pushState(
        {},
        '',
        location.pathname
      );

      searchPage('');

    };

}


/* ==============================
   OPEN DIRECT BADGE URL
   ============================== */

async function boot(){

  const q =
    new URLSearchParams(
      location.search
    ).get('badge');


  if(q){

    try{

      const rec =
        await getBadgeData(
          norm(q)
        );


      if(rec){

        resultPage(rec);

        return;

      }

    }catch(error){

      console.error(error);

    }

  }


  searchPage('');

}


/* ==============================
   BROWSER BACK/FORWARD
   ============================== */

window.addEventListener(
  'popstate',
  boot
);


/* ==============================
   START
   ============================== */

boot();

</script>

</body>
</html>
