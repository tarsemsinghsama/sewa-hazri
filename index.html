<script>
const DATA_URL='data.json';
const UPDATED='Updated on September 18, 2026';
let records=null;

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getRecent(){try{return JSON.parse(localStorage.getItem('sewaHazriRecent')||'[]')}catch{return[]}}
function saveRecent(id){let a=getRecent().filter(x=>x!==id);a.unshift(id);localStorage.setItem('sewaHazriRecent',JSON.stringify(a.slice(0,5)))}
async function load(){if(records)return records;const r=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data');records=await r.json();return records}

llcheck="false" placeholder="Badge ID" value="${esc(prefill)}"><button id="clearBtn" class="clear" aria-label="Clear">×</button></div><button id="searchBtn" class="search-btn">Check attendance</button><div id="status" class="status"></div><div class="recent-wrap"><div id="recent" class="recent"></div></div></main>${footer()}</div>`;
 const input=document.getElementById('badgeInput'), clear=document.getElementById('clearBtn');
 function sync(){input.value=input.value.toUpperCase();clear.classList.toggle('show',!!input.value)}
 input.addEventListener('input',sync);sync();input.focus();
 document.getElementById('searchBtn').onclick=()=>doSearch(input.value);
 input.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(input.value)});clear.onclick=()=>{input.value='';sync();input.focus()};
 renderRecent();
}
function renderRecent(){const el=document.getElementById('recent');const a=getRecent();el.innerHTML=a.map(id=>`<button type="button" data-id="${esc(id)}">${esc(id)}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>doSearch(b.dataset.id))}
async function doSearch(raw){const id=norm(raw), status=document.getElementById('status');if(!id){status.textContent='Please enter Badge ID.';status.className='status err';return}status.textContent='';try{const data=await load();const rec=data.find(x=>norm(x.badge)===id);if(!rec){status.textContent='This Badge ID was not found.';status.className='status err';return}saveRecent(id);history.pushState({badge:id},'',location.pathname+'?badge='+encodeURIComponent(id));resultPage(rec)}catch(e){status.textContent='Attendance data could not be loaded.';status.className='status err'}}
function resultPage(rec){
 app.innerHTML=`<div class="page result-page"><div class="watermark"></div><div class="result-top"><button class="back" id="back"><span>‹</span>Back</button><div class="identity"><div class="badge">${esc(rec.badge)}</div><div class="person-name">${esc(rec.name)}</div><div class="parent-name">${esc(rec.parent)}</div></div></div><section class="summary"><h2>आपकी हाज़री</h2><div class="grid"><div class="cell"><div class="label">दिन</div><div class="value">${esc(rec.day)}</div></div><div class="cell"><div class="label">रात</div><div class="value">${esc(rec.night)}</div></div><div class="cell"><div class="label">शनिवार</div><div class="value">${esc(rec.saturday)}</div></div><div class="cell"><div class="label">रविवार</div><div class="value">${esc(rec.sunday)}</div></div><div class="cell"><div class="label">लिपाई</div><div class="value">${esc(rec.lipai)}</div></div><div class="cell"><div class="label">ब्यास व अन्य</div><div class="value">${esc(rec.beas)}</div></div></div></section><div class="updated"><span class="calendar">▣</span>${UPDATED}</div>${footer()}</div>`;
 document.getElementById('back').onclick=()=>{history.pushState({},'',location.pathname);searchPage(rec.badge)};
}
async function boot(){const q=new URLSearchParams(location.search).get('badge');if(q){try{const data=await load();const rec=data.find(x=>norm(x.badge)===norm(q));if(rec){resultPage(rec);return}}catch{}}searchPage(q||'')}
window.addEventListener('popstate',boot);boot();
</script>
