.page{position:relative;z-index:1;min-height:100vh}
.header{
  background:linear-gradient(135deg,#5b0000,#8d1515);
  color:#fff;
  min-height:92px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px 18px;
  box-shadow:0 3px 14px rgba(0,0,0,.18);
}
.header-inner{display:flex;align-items:center;gap:13px;text-align:center}
.header-logo{width:52px;height:52px;object-fit:contain;border:2px solid rgba(255,255,255,.8);border-radius:5px}
.header-title{font-size:clamp(23px,5vw,35px);font-weight:800;letter-spacing:.2px}
.container{width:min(94%,720px);margin:28px auto 45px}
.card{
  background:rgba(255,255,255,.94);
  border-radius:22px;
  padding:24px;
  box-shadow:0 7px 25px rgba(35,45,55,.10);
  border:1px solid rgba(0,0,0,.04);
}
.search-title{font-size:clamp(23px,5vw,31px);font-weight:800;margin:0 0 20px;color:#3d1010}
.search-row{display:flex;gap:10px}
input{
  flex:1;min-width:0;height:58px;border:1px solid #cbd2d8;border-radius:14px;
  padding:0 18px;font-size:18px;outline:none;background:#fff;
}
input:focus{border-color:#7c1010;box-shadow:0 0 0 3px rgba(124,16,16,.10)}
button{
  width:120px;border:0;border-radius:14px;background:#7a0b0b;color:#fff;
  font-size:18px;font-weight:800;cursor:pointer;
}
button:active{transform:scale(.99)}
.hint{text-align:center;color:#777;margin-top:14px;font-size:16px}
.message{margin-top:14px;text-align:center;font-weight:700;font-size:16px}
.error{color:#a31313}
.success{color:#18733a}
.result{margin-top:22px}
.name{font-size:27px;font-weight:850;color:#2b1515;margin-bottom:9px}
.meta{font-size:17px;margin:7px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.stat{
  min-height:108px;background:rgba(255,255,255,.90);border:1px solid #e1e4e7;
  border-radius:16px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:12px;
}
.stat-label{font-size:17px;color:#555;margin-bottom:7px}
.stat-value{font-size:28px;font-weight:850;color:#20252b}
@media(max-width:520px){
  .header{min-height:82px}
  .header-logo{width:46px;height:46px}
  .header-title{font-size:23px}
  .container{margin-top:20px}
  .card{padding:19px;border-radius:20px}
  .search-row{flex-direction:column}
  button{width:100%;height:54px}
  input{height:54px}
  .grid{grid-template-columns:1fr}
  .name{font-size:25px}
}
</style>
</head>
<body>
<div class="page">

      <div class="header-title">सेवा हाजरी जत्था सिकन्दरपुर</div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1 class="search-title">🔎 अपने बैज नं से हाजरी खोजें</h1>
      <div class="search-row">
        <input id="badgeInput" type="text" autocomplete="off" placeholder="बैज नं डालें">
        <button id="searchBtn">Search</button>
      </div>
      <div id="message" class="message"></div>
      <div id="result" class="result"></div>
    </section>
  </main>
</div>
<footer>
  <div class="contact">Contact No.: +91 93156 64443</div>
</footer>
<script>
let records = [];

const $ = id => document.getElementById(id);

function num(v) {
  if (v === null || v === undefined || v === "") return 0;
  const n = Number(v);
  return Number.isFinite(n) ? n : v;
}

async function loadData() {
  try {
    const response = await fetch("data.json?v=" + Date.now(), {cache:"no-store"});
    if (!response.ok) throw new Error("data.json load failed");
    records = await response.json();
    $("message").textContent = "";
  } catch (e) {
    $("message").className = "message error";
    $("message").textContent = "❌ Attendance data लोड नहीं हुआ।";
  }
}

function searchBadge() {
  const q = $("badgeInput").value.trim().toUpperCase();
  $("result").innerHTML = "";

  if (!q) {
    $("message").className = "message error";
    $("message").textContent = "कृपया अपना बैज नं डालकर Search करें।";
    return;
  }

  const person = records.find(x => String(x.badge || "").trim().toUpperCase() === q);

  if (!person) {
    $("message").className = "message error";
    $("message").textContent = "❌ इस बैज नं का रिकॉर्ड नहीं मिला।";
    return;
  }

  $("message").className = "message success";
  $("message").textContent = "✅ रिकॉर्ड मिल गया।";

  $("result").innerHTML = `
    <div class="card" style="padding:20px;margin-top:0">
      <div class="name">${escapeHtml(person.name)}</div>
      <div class="meta"><b>बैज नं:</b> ${escapeHtml(person.badge)}</div>
      <div class="meta"><b>पिता/पति का नाम:</b> ${escapeHtml(person.parent)}</div>
      <div class="grid">
        <div class="stat"><div class="stat-label">☀️ दिन</div><div class="stat-value">${num(person.day)}</div></div>
        <div class="stat"><div class="stat-label">🌙 रात</div><div class="stat-value">${num(person.night)}</div></div>
        <div class="stat"><div class="stat-label">शनिवार</div><div class="stat-value">${num(person.saturday)}</div></div>
        <div class="stat"><div class="stat-label">रविवार</div><div class="stat-value">${num(person.sunday)}</div></div>
        <div class="stat"><div class="stat-label">लिपाई</div><div class="stat-value">${num(person.lipai)}</div></div>
        <div class="stat"><div class="stat-label">ब्यास</div><div class="stat-value">${num(person.beas)}</div></div>
      </div>
    </div>`;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

$("searchBtn").addEventListener("click", searchBadge);
$("badgeInput").addEventListener("keydown", e => {
  if (e.key === "Enter") searchBadge();
});

loadData();
</script>
</body>
</html>
