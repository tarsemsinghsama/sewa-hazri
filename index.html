    el("info").style.display="none";
    el("tbody").innerHTML="";
    el("msg").textContent="❌ इस बैज नं का रिकॉर्ड नहीं मिला।";
    return;
  }
  showRecord(found[0]);
  render(found);
  el("msg").textContent="✅ रिकॉर्ड मिल गया।";
}
el("q").addEventListener("keydown",e=>{if(e.key==="Enter")search();});
</script>
</body>
</html>
