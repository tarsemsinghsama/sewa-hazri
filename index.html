<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#760000">
<title>Sewadar Information Portal — Sikanderpur</title>
<style>
:root{--maroon:#790000;--maroon2:#5f0000;--ink:#182235;--muted:#697386;--line:#dfe3e8;--gold:#f0d58a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Noto Sans",Arial,sans-serif;color:var(--ink);background:#fff}
body{min-height:100vh}.page{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.page.search-page{background:#fff}.page.result-page{background:#fff}
.watermark{position:absolute;z-index:0;left:50%;top:51%;width:min(82vw,470px);height:min(82vw,470px);transform:translate(-50%,-50%);background:url('assets/rs-sb-logo.png') center/contain no-repeat;opacity:.20;pointer-events:none}
.top{position:relative;z-index:2;text-align:center;padding:38px 18px 18px}.top-logo{width:112px;height:112px;object-fit:contain;display:block;margin:0 auto 17px}.title{font-size:31px;line-height:1.15;font-weight:800;letter-spacing:-.5px}.subtitle{font-size:24px;line-height:1.2;color:#687284;margin-top:5px;font-weight:600}
.content{position:relative;z-index:2;width:min(100% - 28px,560px);margin:30px auto 0}.search-box{height:62px;border:1.5px solid #cfd5dc;border-radius:13px;display:flex;align-items:center;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.search-icon{font-size:25px;color:#677180;padding:0 14px}.search-input{border:0;outline:0;flex:1;min-width:0;height:100%;font-size:20px;font-weight:650;text-transform:uppercase;letter-spacing:.3px;color:var(--ink);background:transparent}.search-input::placeholder{color:#7b8492;font-weight:500;text-transform:none}.clear{border:0;background:transparent;color:#8b929c;font-size:25px;padding:8px 14px;cursor:pointer;display:none}.clear.show{display:block}
.search-btn{width:100%;height:58px;margin-top:16px;border:0;border-radius:11px;background:linear-gradient(180deg,var(--maroon),#930000);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 5px 13px rgba(121,0,0,.18)}.search-btn:active{transform:translateY(1px)}
.status{text-align:center;min-height:24px;margin-top:12px;font-size:15px}.status.err{color:#b3261e}.status.ok{color:#24733e}
.recent-wrap{margin-top:30px;text-align:center}.recent-title{font-size:17px;color:#606b7a;font-weight:650;margin-bottom:13px}.recent{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.recent button{border:1px solid #efd37d;background:#fffaf0;color:var(--maroon);border-radius:10px;padding:9px 13px;font-size:15px;font-weight:700;cursor:pointer}
.footer{position:relative;z-index:2;margin-top:auto;padding:20px 12px 28px;text-align:center;color:var(--maroon);font-size:15px;font-weight:650;opacity:.72}.footer:before,.footer:after{content:"";display:inline-block;vertical-align:middle;width:68px;height:1px;background:currentColor;margin:0 18px 3px}
.result-top{position:relative;z-index:2;padding:25px 18px 0}.back{border:0;background:transparent;color:var(--maroon);font-size:20px;font-weight:650;padding:5px 0;cursor:pointer}.back span{font-size:31px;vertical-align:-2px;margin-right:5px}.identity{text-align:center;margin-top:42px}.badge{font-size:32px;font-weight:850;letter-spacing:.2px;overflow-wrap:anywhere}.person-name{font-size:25px;font-weight:800;margin-top:5px}.parent-name{font-size:18px;color:#747d8c;margin-top:4px;font-weight:550}
.summary{position:relative;z-index:2;width:min(100% - 28px,560px);margin:30px auto 0;border:1px solid rgba(222,226,232,.9);border-radius:16px;background:rgba(255,255,255,.58);box-shadow:0 7px 24px rgba(25,37,52,.08);overflow:hidden;backdrop-filter:blur(1.2px)}
.summary h2{margin:0;padding:19px 20px 13px;color:var(--maroon);font-size:24px;line-height:1.2}.grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(218,223,229,.9)}.cell{min-height:90px;padding:13px 18px;text-align:center;border-right:1px solid rgba(218,223,229,.9);border-bottom:1px solid rgba(218,223,229,.9);background:rgba(255,255,255,.34)}.cell:nth-child(2n){border-right:0}.cell:nth-last-child(-n+2){border-bottom:0}.label{font-size:16px;font-weight:650;color:#303b4d}.value{font-size:29px;font-weight:850;margin-top:4px}.updated{text-align:center;position:relative;z-index:2;color:#687386;font-size:16px;margin:20px 12px 0}.calendar{font-size:19px;margin-right:7px}
@media(max-width:520px){.top{padding-top:28px}.top-logo{width:100px;height:100px}.title{font-size:27px}.subtitle{font-size:22px}.content{margin-top:24px}.identity{margin-top:32px}.badge{font-size:28px}.person-name{font-size:23px}.parent-name{font-size:17px}.summary h2{font-size:22px}.cell{min-height:82px;padding:12px 8px}.label{font-size:15px}.value{font-size:27px}.footer:before,.footer:after{width:44px;margin:0 10px 3px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA_URL='data.json';
const UPDATED='Updated on September 18, 2026';
let records=null;
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').trim().toUpperCase().replace(/\s+/g,'');
function getRecent(){try{return JSON.parse(localStorage.getItem('sewaHazriRecent')||'[]')}catch{return[]}}
function saveRecent(id){let a=getRecent().filter(x=>x!==id);a.unshift(id);localStorage.setItem('sewaHazriRecent',JSON.stringify(a.slice(0,5)))}
async function load(){if(records)return records;const r=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data');records=await r.json();return records}
function footer(){return '<footer class="footer">Contact No.: +91 93156 64443</footer>'}
function searchPage(prefill=''){
 app.innerHTML=`<div class="page search-page"><div class="top"><img class="top-logo" src="assets/rs-sb-logo.png" alt="RS SB"><div class="title">Sewadar Information Portal</div><div class="subtitle">Sikanderpur</div></div><main class="content"><div class="search-box"><span class="search-icon">⌕</span><input id="badgeInput" class="search-input" autocomplete="off" spellcheck="false" placeholder="Badge ID" value="${esc(prefill)}"><button id="clearBtn" class="clear" aria-label="Clear">×</button></div><button id="searchBtn" class="search-btn">Check attendance</button><div id="status" class="status"></div><div class="recent-wrap"><div class="recent-title">◷ &nbsp;Last 5 Searched Badge IDs</div><div id="recent" class="recent"></div></div></main>${footer()}</div>`;
 const input=document.getElementById('badgeInput'), clear=document.getElementById('clearBtn');
 function sync(){input.value=input.value.toUpperCase();clear.classList.toggle('show',!!input.value)}
 input.addEventListener('input',sync);sync();input.focus();
 document.getElementById('searchBtn').onclick=()=>doSearch(input.value);
 input.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(input.value)});clear.onclick=()=>{input.value='';sync();input.focus()};
 renderRecent();
}
function renderRecent(){const el=document.getElementById('recent');const a=getRecent();el.innerHTML=a.map(id=>`<button type="button" data-id="${esc(id)}">${esc(id)}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>doSearch(b.dataset.id))}
async function doSearch(raw){const id=norm(raw), status=document.getElementById('status');if(!id){status.textContent='Please enter Badge ID.';status.className='status err';return}status.textContent='';try{const data=await load();const rec=data.find(x=>norm(x.badge)===id);if(!rec){status.textContent='This Badge ID was not found.';status.className='status err';return}saveRecent(id);history.pushState({badge:id},'',location.pathname+'?badge='+encodeURIComponent(id));resultPage(rec)}catch(e){status.textContent='Attendance data could not be loaded.';status.className='status err'}}
function resultPage(rec){
 app.innerHTML=`<div class="page result-page"><div class="watermark"></div><div class="result-top"><button class="back" id="back"><span>‹</span>Back</button><div class="identity"><div class="badge">${esc(rec.badge)}</div><div class="person-name">${esc(rec.name)}</div><div class="parent-name">${esc(rec.parent)}</div></div></div><section class="summary"><h2>Attendance Summary</h2><div class="grid"><div class="cell"><div class="label">Day</div><div class="value">${esc(rec.day)}</div></div><div class="cell"><div class="label">Night</div><div class="value">${esc(rec.night)}</div></div><div class="cell"><div class="label">Saturday</div><div class="value">${esc(rec.saturday)}</div></div><div class="cell"><div class="label">Sunday</div><div class="value">${esc(rec.sunday)}</div></div><div class="cell"><div class="label">Lipai</div><div class="value">${esc(rec.lipai)}</div></div><div class="cell"><div class="label">Beas</div><div class="value">${esc(rec.beas)}</div></div></div></section><div class="updated"><span class="calendar">▣</span>${UPDATED}</div>${footer()}</div>`;
 document.getElementById('back').onclick=()=>{history.pushState({},'',location.pathname);searchPage(rec.badge)};
}
async function boot(){const q=new URLSearchParams(location.search).get('badge');if(q){try{const data=await load();const rec=data.find(x=>norm(x.badge)===norm(q));if(rec){resultPage(rec);return}}catch{}}searchPage(q||'')}
window.addEventListener('popstate',boot);boot();
</script>
</body>
</html>
