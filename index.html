I<type html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>सेवा हाज़री जत्था सिकन्दरपुर</title>
<style>
*{box-sizing:border-box}

body{
  margin:0;
  background-color:#eef3f7;
  color:#17202a;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:url("https://drive.google.com/uc?export=view&id=1h99GBiqzXiNPosXbhMpGQ1bQLe18shv9");
  background-repeat:repeat;
  background-position:center;
  background-size:260px;
  opacity:50;
  pointer-events:none;
  z-index:50;
}

header,
.wrap{
  position:relative;
  z-index:1;
}
header{background:#590100;color:#fff;text-align:center;padding:18px 10px;font-size:26px;font-weight:700}
.wrap{max-width:720px;margin:28px auto;padding:0 15px}.card{background:#fff;border-radius:20px;padding:24px 17px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h2{margin:0 0 20px;font-size:25px}.search{display:flex;gap:10px}
input{flex:1;padding:15px;border:1px solid #c9d0d6;border-radius:12px;font-size:17px;text-transform:uppercase}
button{padding:0 24px;border:0;border-radius:12px;background:#16733b;color:#fff;font-size:17px;font-weight:700}
#message{text-align:center;margin-top:13px;color:#69727c}.result{display:none}.name{font-size:25px;font-weight:700;margin-bottom:15px}
.line{font-size:17px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{text-align:center;background:#fafafa;border:1px solid #e1e5e8;border-radius:13px;padding:15px}.stat span{display:block;margin-bottom:6px}.stat b{font-size:26px}
.err{background:#fff1f0;color:#a61b1b;padding:12px;border-radius:10px}
@media(max-width:560px){header{font-size:22px}.search{display:block}button{width:100%;height:55px;margin-top:10px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>🙏 सेवा हाज़री जत्था सिकन्दरपुर</header>
<div class="wrap">
<div class="card">
<h2>🔎 अपने बैज नं से हाज़री खोजें</h2>
<div class="search">
<input id="q" autocomplete="off" placeholder="अपना बैज आईडी यहाँ डालें">
<button onclick="searchBadge()">Check Attendance</button>
</div>
<div id="message"></div>
</div>
<div id="result"></div>
</div>
<script>
let records=[];
const clean=v=>String(v??"").trim().toUpperCase().replace(/\s+/g,"");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function loadData(){
  try{
    const r=await fetch("data.json?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw Error();
    const j=await r.json();
    records=Array.isArray(j)?j:(j.records||[]);
    document.getElementById("message").textContent="कृपया अपना बैज नं डालकर Search करें।👆";
  }catch(e){
    document.getElementById("message").innerHTML='<div class="err">❌ Attendance data लोड नहीं हुआ।</div>';
  }
}
function searchBadge(){
  const q=clean(document.getElementById("q").value), msg=document.getElementById("message"), out=document.getElementById("result");
  if(!q){msg.textContent="कृपया अपना बैज नं डालकर Search करें।";out.innerHTML="";return}
  const x=records.find(r=>clean(r.badge)===q);
  if(!x){msg.textContent="❌ इस बैज नं की हाज़री नहीं मिली।";out.innerHTML="";return}
  msg.textContent="✅ रिकॉर्ड मिल गया।";
  out.innerHTML=`<div class="card"><div class="name">${esc(x.name)}</div>
  <div class="line"><b>बैज नं:</b> ${esc(x.badge)}</div>
  <div class="line"><b>पिता/पति का नाम:</b> ${esc(x.father)}</div>
  <div class="grid">
  <div class="stat">☀️ दिन  <b>${esc(x.day)}</b></div>
  <div class="stat">🌙 रात  <b>${esc(x.night)}</b></div>
  <div class="stat">शनिवार  <b>${esc(x.saturday)}</b></div>
  <div class="stat">रविवार  <b>${esc(x.sunday)}</b></div>
  <div class="stat">लिपाई  <b>${esc(x.lipai)}</b></div>
  <div class="stat">ब्यास व अन्य  <b>${esc(x.beas)}</b></div>
  </div></div>`;
}
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")searchBadge()});
loadData();
</script>
</body>
</html>
