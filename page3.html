<script>

const SHEET_ID=
'1H_TIjqyH_Hphcj315ZxAG52Jpoj7WF5TY5sl4DHSAs8';

const SHEET_NAME=
'MaleFemaleSKP';


const params=
new URLSearchParams(location.search);

const BADGE_ID=
(params.get('badge')||'').trim();

const URL_NAME=
  (params.get('name')||'').trim();

const URL_PARENT=
  (params.get('parent')||'').trim();
      


document.getElementById('badge')

BADGE_ID||'—';


if(BADGE_ID){

  document.getElementById(
    'secondPageLink'

function clean(v){

  return String(v??'')
    .replace(/\u00a0/g,' ')
    .replace(/\s+/g,' ')
    .trim();

}


function norm(v){

  return clean(v)
    .toUpperCase()
    .replace(
      /[^A-Z0-9\u0900-\u097F]/g,
      ''
    );

}


function val(c){

  if(!c)return '';

  if(
    c.f!==undefined &&
    c.f!==null &&
    clean(c.f)!==''
  ){
    return c.f;
  }

  if(
    c.v!==undefined &&
    c.v!==null
  ){
    return c.v;
  }

  return '';

}


function parseGViz(text){

  const a=text.indexOf('{');
  const b=text.lastIndexOf('}');

  if(a<0 || b<0){
    throw Error(
      'Google Sheet response नहीं मिला'
    );
  }

  const json=
    JSON.parse(
      text.slice(a,b+1)
    );

  const table=json.table;

  if(
    !table ||
    !Array.isArray(table.rows)
  ){
    throw Error(
      'Google Sheet में data नहीं मिला'
    );
  }

  const n=
    (table.cols||[]).length;

  return table.rows.map(row=>{

    const out=
      new Array(n).fill('');

    (row.c||[]).forEach(
      (cell,i)=>{

        if(i<n){
          out[i]=val(cell);
        }

      }
    );

    return out;

  });

}


function parseGVizHeaderRow(text){

  const a=text.indexOf('{');
  const b=text.lastIndexOf('}');

  if(a<0 || b<0){
    throw Error(
      'Header row response नहीं मिला'
    );
  }

  const json=
    JSON.parse(
      text.slice(a,b+1)
    );

  const cols=
    json.table?.cols||[];

  return cols.map(col=>{

    const s=clean(col.label);

    if(/^Col\d+$/i.test(s)){
      return '';
    }

    return s;

  });

}


function isShortDate(v){

  const s=clean(v);

  if(
    /^\d{1,2}[-\/.](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)$/i
    .test(s)
  ){
    return true;
  }

  if(
    /^\d{1,2}[-\/.](January|February|March|April|May|June|July|August|September|October|November|December)$/i
    .test(s)
  ){
    return true;
  }

  if(
    /^\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}$/
    .test(s)
  ){
    return true;
  }

  if(
    /^\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}$/
    .test(s)
  ){
    return true;
  }

  return /^Date\(\d{4},\d{1,2},\d{1,2}\)$/i
    .test(s);

}


function monthNumber(name){

  const m={

    JANUARY:1,
    FEBRUARY:2,
    MARCH:3,
    APRIL:4,
    MAY:5,
    JUNE:6,
    JULY:7,
    AUGUST:8,
    SEPTEMBER:9,
    OCTOBER:10,
    NOVEMBER:11,
    DECEMBER:12,

    JAN:1,
    FEB:2,
    MAR:3,
    APR:4,
    JUN:6,
    JUL:7,
    AUG:8,
    SEP:9,
    OCT:10,
    NOV:11,
    DEC:12

  };

  return m[
    clean(name).toUpperCase()
  ]||0;

}


function monthHeader(v){

  const s=
    clean(v)
    .toUpperCase()
    .replace(/\s+/g,'_');

  const m=
    s.match(
      /^(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER|JAN|FEB|MAR|APR|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[_-]?(\d{4})$/
    );

  if(!m)return null;

  return{
    month:monthNumber(m[1]),
    year:Number(m[2])
  };

}


function two(n){

  return String(n).padStart(2,'0');

}


function formatDateCell(
  value,
  monthInfo
){

  const s=clean(value);

  let m=
    s.match(
      /^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/i
    );

  if(m){

    return two(Number(m[3]))+
      '-'+
      two(Number(m[2])+1)+
      '-'+
      m[1];

  }

  m=
    s.match(
      /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/
    );

  if(m){

    let y=m[3];

    if(y.length===2){
      y='20'+y;
    }

    return two(Number(m[1]))+
      '-'+
      two(Number(m[2]))+
      '-'+
      y;

  }

  m=
    s.match(
      /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/
    );

  if(m){

    return two(Number(m[3]))+
      '-'+
      two(Number(m[2]))+
      '-'+
      m[1];

  }

  m=
    s.match(
      /^(\d{1,2})[-\/.]([A-Za-z]{3,9})$/
    );

  if(m && monthInfo){

    const mn=
      monthNumber(m[2]);

    if(mn){

      return two(Number(m[1]))+
        '-'+
        two(mn)+
        '-'+
        monthInfo.year;

    }

  }

  return s;

}


function attendanceNumber(v){

  const s=
    clean(v).replace(/,/g,'');

  if(!s)return null;

  const n=Number(s);

  if(
    Number.isFinite(n) &&
    n>0
  ){
    return n;
  }

  return null;

}

      

function findBadgeRow(rows,badge,name,parent){

  const targetBadge=norm(badge);
  const targetName=norm(name);
  const targetParent=norm(parent);

  let badgeMatches=[];

  for(let r=0;r<rows.length;r++){

    let foundBadge=false;

    for(
      let c=0;
      c<Math.min(rows[r].length,5);
      c++
    ){

      if(
        norm(rows[r][c])===targetBadge
      ){

        foundBadge=true;
        break;

      }

    }

    if(foundBadge){
      badgeMatches.push(r);
    }

  }


  /* अगर Badge unique है */
  if(badgeMatches.length===1){
    return badgeMatches[0];
  }


  /*
     Badge duplicate है।
     अब Name + Parent से exact व्यक्ति खोजें।
  */

  for(const r of badgeMatches){

    const row=rows[r]||[];

    const rowName=norm(row[1]);
    const rowParent=norm(row[2]);

    if(
      rowName===targetName &&
      rowParent===targetParent
    ){

      return r;

    }

  }


  /*
     Name से match
  */

  for(const r of badgeMatches){

    const row=rows[r]||[];

    if(
      norm(row[1])===targetName
    ){

      if(
        !targetParent ||
        norm(row[2])===targetParent
      ){

        return r;

      }

    }

  }


  return -1;
}
      


function findDateRow(
  rows,
  badgeRow
){

  let best=-1;
  let bestCount=0;

  for(
    let r=0;
    r<badgeRow;
    r++
  ){

    let count=0;

    for(
      let c=0;
      c<rows[r].length;
      c++
    ){

      if(
        isShortDate(
          rows[r][c]
        )
      ){
        count++;
      }

    }

    if(count>bestCount){

      bestCount=count;
      best=r;

    }

  }

  return best;

}


function activity(v){

  const s=clean(v);

  const u=
    s.toUpperCase()
    .replace(/\s+/g,' ');

  if(
    u==='DAY' ||
    u==='D' ||
    s==='दिन'
  ){
    return 'दिन';
  }

  if(
    u==='NIGHT' ||
    u==='N' ||
    s==='रात'
  ){
    return 'रात';
  }

  if(
    u==='BEAS' ||
    u==='B' ||
    s==='ब्यास' ||
    s==='ब्यास सेवा'
  ){
    return 'ब्यास';
  }

  if(
    u.includes('LIPAI') ||
    u.includes('LIPAY') ||
    s.includes('लिपाई')
  ){
    return 'दिन लिपाई';
  }

  if(
    u.includes('SAHARANPUR') ||
    s.includes('सहारनपुर')
  ){
    return 'सहारनपुर';
  }

  return s;

}


function makeRecords(
  rows,
  badgeRow,
  activityValues,
  monthValues
){

  const dateRow=
    findDateRow(
      rows,
      badgeRow
    );

  if(dateRow<0){

    throw Error(
      'तारीख़ वाली row नहीं मिली'
    );

  }

  const badgeData=
    rows[badgeRow]||[];

  const cols=
    Math.max(
      rows[dateRow]?.length||0,
      badgeData.length,
      activityValues.length,
      monthValues.length,
      ...rows.map(r=>r.length)
    );

  let currentMonth=null;

  const result=[];

  for(
    let c=0;
    c<cols;
    c++
  ){

    const mh=
      monthHeader(
        monthValues[c]
      );

    if(mh){
      currentMonth=mh;
    }

    const dateValue=
      rows[dateRow]?.[c]??'';

    if(
      !isShortDate(dateValue)
    ){
      continue;
    }

    const dateText=
      formatDateCell(
        dateValue,
        currentMonth
      );

    if(!dateText){
      continue;
    }

    const rawActivity=
      clean(
        activityValues[c]??''
      );

    const u=
      rawActivity.toUpperCase();

    const validActivity=
      u==='DAY' ||
      u==='D' ||
      u==='NIGHT' ||
      u==='N' ||
      u==='BEAS' ||
      u==='B' ||
      u.includes('LIPAI') ||
      u.includes('LIPAY') ||
      rawActivity.includes('लिपाई') ||
      u.includes('SAHARANPUR') ||
      rawActivity.includes('सहारनपुर') ||
      rawActivity==='दिन' ||
      rawActivity==='रात' ||
      rawActivity==='ब्यास';

    const act=
      validActivity
      ? activity(rawActivity)
      : '';

    const raw=
      badgeData[c]??'';

    const number=
      attendanceNumber(raw);

    if(number===null){
      continue;
    }

    let label=dateText;

    if(act){
      label+=' '+act;
    }

    result.push({
      date:dateText,
      activity:act,
      value:number,
      label:label
    });

  }

  return result;

}


function esc(v){

  return String(v??'')

    .replace(/&/g,'&amp;')

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}

  status.textContent=

  let html=

    '<tr>'+
    '<th>तारीख़</th>'+
    '<th>गतिविधि</th>'+
    '<th>हाज़री</th>'+
    '</tr>'+
    '</thead>'+
    '<tbody>';

  items.forEach(item=>{

    html+=
      '<tr>'+

'<td>'+
esc(item.date)+
'</td>'+
'<td>'+
esc(item.activity)+
'</td>'+
'<td>'+
esc(item.value)+
'</td>'+
          
      '<td>'+
      esc(item.value)+
      '</td>'+
      '</tr>';

  });

  html+=
    '</tbody>'+
    '</table>'+
    '</div>';

  box.innerHTML=html;

}


async function logo(){

  try{

    const r=
      await fetch(
        './index.html?logo='+
        Date.now(),
        {
          cache:'no-store'
        }
      );

    if(!r.ok)return;

    const t=
      await r.text();

    const m=
      t.match(
        /data:image\/png;base64,[A-Za-z0-9+/=]+/i
      );

    if(m){

      document.getElementById(
  'watermarkLogo'
).style.backgroundImage=
  'url("'+m[0]+'")';

    }

  }catch(e){

    console.error(e);

  }

}


async function load(){

  const status=
    document.getElementById(
      'status'
    );

  const box=
    document.getElementById(
      'result'
    );

  if(!BADGE_ID){

    status.textContent=
      'Badge ID नहीं मिली।';

    box.innerHTML=
      '<div class="error">'+
      'कृपया 2nd Page से '+
      '“तारीख़वार हाज़री” खोलें।'+
      '</div>';

    return;

  }

  try{

    const baseUrl=
      'https://docs.google.com/spreadsheets/d/'+
      SHEET_ID+
      '/gviz/tq';

    const sheetParam=
      '&sheet='+
      encodeURIComponent(
        SHEET_NAME
      );

    const cache=
      '&t='+Date.now();


    /* MAIN DATA */

    const dataUrl=
      baseUrl+
      '?tqx=out:json&headers=0'+
      sheetParam+
      cache;


    /* ACTIVITY ROW */

    const activityUrl=
      baseUrl+
      '?tqx=out:json&headers=1'+
      sheetParam+
      '&range=A3:ZZ3'+
      cache;


    /* MONTH ROW */

    const monthUrl=
      baseUrl+
      '?tqx=out:json&headers=1'+
      sheetParam+
      '&range=A1:ZZ1'+
      cache;


    const[
      dataResponse,
      activityResponse,
      monthResponse
    ]=
      await Promise.all([

        fetch(
          dataUrl,
          {cache:'no-store'}
        ),

        fetch(
          activityUrl,
          {cache:'no-store'}
        ),

        fetch(
          monthUrl,
          {cache:'no-store'}
        )

      ]);


    if(!dataResponse.ok){

      throw Error(
        'Google Sheet data load नहीं हुआ'
      );

    }


    if(!activityResponse.ok){

      throw Error(
        'Activity row load नहीं हुई'
      );

    }


    if(!monthResponse.ok){

      throw Error(
        'Month row load नहीं हुई'
      );

    }


    const rows=
      parseGViz(
        await dataResponse.text()
      );


    const activityValues=
      parseGVizHeaderRow(
        await activityResponse.text()
      );


    const monthValues=
      parseGVizHeaderRow(
        await monthResponse.text()
      );


    const badgeRow=
  findBadgeRow(
    rows,
    BADGE_ID,
    URL_NAME,
    URL_PARENT
  );


    if(badgeRow<0){

      throw Error(
        'Badge No. नहीं मिला: '+
        BADGE_ID
      );

    }


    /* =========================
       NAME + PARENT NAME
    ========================= */

    const badgeData=
      rows[badgeRow]||[];


    const personName=
  clean(
    badgeData[1] || URL_NAME || ''
  );

const parentName=
  clean(
    badgeData[2] || URL_PARENT || ''
  );


    document.getElementById(
      'personName'
    ).textContent=
      personName||'—';


    document.getElementById(
      'parentName'
    ).textContent=
      parentName||'—';


    const items=
      makeRecords(
        rows,
        badgeRow,
        activityValues,
        monthValues
      );


    show(items);

  }
  catch(e){

    console.error(e);

    status.textContent=
      'डेटा लोड नहीं हो सका।';

    box.innerHTML=
      '<div class="error">'+
      '<b>'+
      'Google Sheet से तारीख़वार हाज़री नहीं आ सकी।'+
      '</b>'+
      '<br><br>'+
      'Error: '+
      esc(e.message||e)+
      '</div>';

  }

}


logo();
load();

</script>

</body>
</html>
