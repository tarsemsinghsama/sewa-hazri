<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>तारीख़वार हाज़री</title><style>
:root{--maroon:#790000;--muted:#697386;--line:#dfe3e8}*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#182235}body{overflow-x:hidden}.watermark{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);width:min(620px,88vw);opacity:.075;pointer-events:none;z-index:0}.watermark img{width:100%;display:block}.top{position:relative;z-index:2;text-align:center;padding:28px 15px 10px}.top-logo{width:112px;height:112px;object-fit:contain;display:block;margin:0 auto 5px}h1{margin:0;color:var(--maroon);font-size:29px;font-weight:800}.sub{margin-top:5px;font-size:23px;font-weight:800}.nav{position:relative;z-index:2;display:flex;gap:10px;width:min(660px,calc(100% - 30px));margin:18px auto 20px}.nav a{flex:1;display:block;text-align:center;text-decoration:none;color:var(--maroon);background:#fff;border:1.5px solid var(--maroon);border-radius:14px;padding:15px 8px;font-size:17px;font-weight:800}.card{position:relative;z-index:2;width:min(660px,calc(100% - 30px));margin:0 auto;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 18px rgba(0,0,0,.08);padding:20px 14px}.badge-label{text-align:center;color:var(--muted);font-size:18px}.badge{text-align:center;color:var(--maroon);font-size:28px;font-weight:900;margin-top:8px;word-break:break-word}.title{text-align:center;color:var(--maroon);font-size:27px;font-weight:900;margin:20px 0 14px}.status{text-align:center;color:var(--muted);font-size:15px;margin:0 0 14px}.table-wrap{width:100%;overflow-x:auto;border:1px solid #eadede;border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;min-width:390px}th,td{border-bottom:1px solid #eadede;padding:11px 9px;text-align:left;font-size:15px}th{background:#fff7f7;color:var(--maroon);font-weight:800;white-space:nowrap}td:last-child,th:last-child{text-align:center;width:90px}tr:last-child td{border-bottom:none}.empty,.error{padding:18px 12px;text-align:center;border-radius:12px;font-size:16px;line-height:1.6}.empty{color:var(--maroon);background:#fff8f8;border:1px solid #eadede}.error{color:#8a1f1f;background:#fff6f6;border:1px solid #eadede}.footer{position:relative;z-index:2;text-align:center;color:var(--muted);font-size:16px;margin:54px 0 30px}.footer b{color:var(--maroon)}@media(max-width:600px){.top{padding-top:22px}.top-logo{width:76px;height:76px}h1{font-size:25px}.sub{font-size:20px}.nav{margin-top:16px}.nav a{padding:13px 6px;font-size:16px}.card{padding:18px 10px}.badge{font-size:26px}.title{font-size:25px}th,td{font-size:14px;padding:10px 7px}}
</style></head><body>
<div class="watermark"><img id="watermarkLogo" alt=""></div><header class="top"><img id="topLogo" class="top-logo" alt="RSB"><h1>Sewadar Information Portal</h1><div class="sub">सिकन्दरपुर</div></header><nav class="nav"><a href="./index.html">🏠 Home Page</a><a id="secondPageLink" href="./index.html">⬅️ 2nd Page</a></nav><main class="card"><div class="badge-label">Badge ID</div><div id="badge" class="badge">—</div><div class="title">तारीख़वार हाज़री</div><div id="status" class="status">हाज़री की जानकारी लोड हो रही है...</div><div id="result"></div></main><footer class="footer">Contact No.: <b>+91 93156 64443</b></footer>
<script>
const SHEET_ID='1H_TIjqyH_Hphcj315ZxAG52Jpoj7WF5TY5sl4DHSAs8',SHEET_NAME='MaleFemaleSKP';
const params=new URLSearchParams(location.search),BADGE_ID=(params.get('badge')||'').trim();
document.getElementById('badge').textContent=BADGE_ID||'—';if(BADGE_ID)document.getElementById('secondPageLink').href='./index.html?badge='+encodeURIComponent(BADGE_ID);
function clean(v){return String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()}function norm(v){return clean(v).toUpperCase().replace(/[^A-Z0-9\u0900-\u097F]/g,'')}function date(v){return /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.test(clean(v))||/^\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}$/.test(clean(v))}function fmtDate(v){let s=clean(v),m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);return m?m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+m[3]:s}
function act(v){let s=clean(v),u=s.toUpperCase();if(u==='DAY'||u==='D'||s==='दिन')return'दिन';if(u==='NIGHT'||u==='N'||s==='रात')return'रात';if(u==='BEAS'||s==='ब्यास'||s==='ब्यास सेवा')return'ब्यास';if(u.includes('LIPAI')||s.includes('लिपाई'))return'लिपाई';if(u.includes('SAHARANPUR')||s.includes('सहारनपुर'))return'सहारनपुर';return s}
function val(c){return c?(c.v!==undefined&&c.v!==null?c.v:(c.f??'')):''}
function parse(t){let a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw Error('Google Sheet response नहीं मिला');let j=JSON.parse(t.slice(a,b+1)),tab=j.table;if(!tab||!Array.isArray(tab.rows))throw Error('Google Sheet में data नहीं मिला');let n=(tab.cols||[]).length;return tab.rows.map(r=>{let x=new Array(n).fill('');(r.c||[]).forEach((c,i)=>{if(i<n)x[i]=val(c)});return x})}
function find(rows,b){let t=norm(b);for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++)if(norm(rows[r][c])===t)return r;return-1}
function make(rows,br){let dr=-1;for(let r=0;r<Math.min(br,rows.length);r++)if(rows[r].some(date)){dr=r;break}if(dr<0)dr=2;let ar=dr+1;if(!rows[dr])throw Error('तारीख वाली header row नहीं मिली');let cols=Math.max(...rows.map(x=>x.length),rows[br].length),cur='',first=-1,out=[];for(let c=0;c<cols;c++){let d=rows[dr][c]??'',a=rows[ar]?.[c]??'';if(date(d)){cur=fmtDate(d);if(first<0)first=c}if(first<0||!cur)continue;let v=rows[br][c];if(clean(v)==='')continue;let label=cur,aa=act(a);if(aa)label+=' '+aa;out.push([label,clean(v)])}return out}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function show(items){let s=document.getElementById('status'),b=document.getElementById('result');if(!items.length){s.textContent='डेटा मिल गया, लेकिन इस Badge ID की कोई तारीख़वार हाज़री नहीं मिली।';b.innerHTML='<div class="empty">इस Badge ID की तारीख़वार हाज़री नहीं मिली।</div>';return}s.textContent='कुल '+items.length+' तारीख़/गतिविधियाँ मिलीं।';let h='<div class="table-wrap"><table><thead><tr><th>तारीख़ / गतिविधि</th><th>हाज़री</th></tr></thead><tbody>';items.forEach(x=>h+='<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>');b.innerHTML=h+'</tbody></table></div>'}
async function logo(){try{let r=await fetch('./index.html',{cache:'no-store'});if(!r.ok)return;let t=await r.text(),m=t.match(/data:image\/png;base64,[A-Za-z0-9+/=]+/i);if(m){document.getElementById('topLogo').src=m[0];document.getElementById('watermarkLogo').src=m[0]}}catch(e){}}
async function load(){let s=document.getElementById('status'),b=document.getElementById('result');if(!BADGE_ID){s.textContent='Badge ID नहीं मिली।';b.innerHTML='<div class="error">कृपया 2nd Page से “तारीख़वार हाज़री” खोलें।</div>';return}try{let u='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent(SHEET_NAME),r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('Google Sheet खुल नहीं रही');let rows=parse(await r.text()),br=find(rows,BADGE_ID);if(br<0){s.textContent='Badge ID नहीं मिली।';b.innerHTML='<div class="error">Google Sheet <b>'+esc(SHEET_NAME)+'</b> में <b>'+esc(BADGE_ID)+'</b> नहीं मिली।</div>';return}show(make(rows,br))}catch(e){s.textContent='डेटा लोड नहीं हो सका।';b.innerHTML='<div class="error"><b>Google Sheet से तारीख़वार हाज़री नहीं आ सकी।</b><br><br>Google Sheet public/readable होनी चाहिए और '+esc(SHEET_NAME)+' tab उपलब्ध होना चाहिए।<br><br>Error: '+esc(e.message||e)+'</div>'}}
logo();load();
</script></body></html>
