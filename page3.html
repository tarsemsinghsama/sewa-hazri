<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#760000">
<title>Sewadar Information Portal — सिकन्दरपुर</title>
<style>
:root{--maroon:#790000;--ink:#182235;--muted:#697386;--line:#dfe3e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Noto Sans",Arial,sans-serif;color:var(--ink);background:#fff}body{min-height:100vh}.page{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#fff}
.watermark{position:absolute;z-index:0;left:50%;top:52%;width:min(82vw,470px);height:min(82vw,470px);transform:translate(-50%,-50%);background-position:center;background-size:contain;background-repeat:no-repeat;opacity:.10;pointer-events:none}
.top{position:relative;z-index:2;text-align:center;padding:25px 18px 0}.top-logo{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 17px}.title{font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.5px}.subtitle{font-size:22px;line-height:1.2;color:#687284;margin-top:5px;font-weight:600}
.result-top{position:relative;z-index:2;padding:18px 18px 0}.back{border:0;background:transparent;color:var(--maroon);font-size:20px;font-weight:650;padding:5px 0;cursor:pointer}.back span{font-size:31px;vertical-align:-2px;margin-right:5px}.identity{text-align:center;margin-top:28px}.badge{font-size:24px;font-weight:850;letter-spacing:.2px;overflow-wrap:anywhere}.person-name{font-size:20px;font-weight:800;margin-top:5px}.parent-name{font-size:18px;color:#747d8c;margin-top:4px;font-weight:550}
.summary{position:relative;z-index:2;width:min(100% - 28px,560px);margin:25px auto 0;border:1px solid rgba(222,226,232,.9);border-radius:16px;background:rgba(255,255,255,.62);box-shadow:0 7px 24px rgba(25,37,52,.08);overflow:hidden;backdrop-filter:blur(1.2px)}.summary h2{margin:0;padding:19px 20px 13px;color:var(--maroon);font-size:24px;line-height:1.2}.status{position:relative;z-index:2;text-align:center;color:#687386;font-size:15px;padding:0 15px 14px}.status.err{color:#a32020}.date-list{border-top:1px solid rgba(218,223,229,.9)}.date-row{display:grid;grid-template-columns:1fr 82px;align-items:center;min-height:70px;padding:12px 18px;border-bottom:1px solid rgba(218,223,229,.9);background:rgba(255,255,255,.34)}.date-row:last-child{border-bottom:0}.date-info{min-width:0;text-align:left}.date{font-size:17px;font-weight:800;color:#303b4d;line-height:1.25}.activity{font-size:15px;color:#697386;font-weight:600;margin-top:3px}.count{text-align:right;font-size:27px;font-weight:850;color:var(--ink)}.empty{padding:20px 14px;text-align:center;color:var(--maroon);font-size:16px}.updated{text-align:center;position:relative;z-index:2;color:#687386;font-size:15px;margin:18px 12px 0}.calendar{font-size:18px;margin-right:7px}
footer{position:relative;z-index:10;text-align:center;padding:12px 12px 24px;margin-top:auto;color:var(--maroon);font-size:12px;font-weight:650;opacity:.60}footer:before,footer:after{content:"";display:inline-block;vertical-align:middle;width:68px;height:1px;background:currentColor;margin:0 18px 3px}
@media(max-width:520px){.top{padding-top:25px}.top-logo{width:56px;height:56px}.title{font-size:27px}.subtitle{font-size:22px}.identity{margin-top:28px}.badge{font-size:24px}.person-name{font-size:20px}.parent-name{font-size:18px}.summary h2{font-size:22px}.date-row{grid-template-columns:1fr 70px;min-height:68px;padding:11px 12px}.date{font-size:16px}.activity{font-size:14px}.count{font-size:25px}footer:before,footer:after{width:44px;margin:0 10px 3px}}
</style>
</head>
<body>
<div class="page">
<div id="watermark" class="watermark"></div>
<header class="top"><img id="topLogo" class="top-logo" alt="RS SB"><div class="title">Sewadar Information Portal</div><div class="subtitle">सिकन्दरपुर</div></header>
<div class="result-top"><button type="button" class="back" id="backBtn"><span>‹</span>Back</button><div class="identity"><div id="badge" class="badge">—</div><div id="personName" class="person-name"></div><div id="parentName" class="parent-name"></div></div></div>
<section class="summary"><h2>तारीख़वार हाज़री</h2><div id="status" class="status">हाज़री की जानकारी लोड हो रही है...</div><div id="dateList" class="date-list"></div></section>
<div class="updated"><span class="calendar">▣</span>Live Data Updates</div><footer>Contact No.: +91 93156 64443</footer>
</div>

<script>
const SHEET_ID='1H_TIjqyH_Hphcj315ZxAG52Jpoj7WF5TY5sl4DHSAs8';
const SHEET_NAME='MaleFemaleSKP';

const params=new URLSearchParams(location.search);
const BADGE_ID=(params.get('badge')||'').trim();

const $=id=>document.getElementById(id);

function clean(v){
  return String(v??'')
    .replace(/\u00a0/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function norm(v){
  return clean(v)
    .toUpperCase()
    .replace(/[^A-Z0-9\u0900-\u097F]/g,'');
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}


/* =========================
   GOOGLE GVIZ DATA
========================= */

function parseGViz(text){

  const start=text.indexOf('{');
  const end=text.lastIndexOf('}');

  if(start<0 || end<0){
    throw new Error('Invalid Google Sheet response');
  }

  const json=JSON.parse(
    text.slice(start,end+1)
  );

  return (json.table?.rows||[]).map(row =>
    (row.c||[]).map(cell =>
      cell ? (cell.f ?? cell.v ?? '') : ''
    )
  );
}


/* =========================
   MONTH
========================= */

const MONTHS={
  jan:1,january:1,
  feb:2,february:2,
  mar:3,march:3,
  apr:4,april:4,
  may:5,
  jun:6,june:6,
  jul:7,july:7,
  aug:8,august:8,
  sep:9,sept:9,september:9,
  oct:10,october:10,
  nov:11,november:11,
  dec:12,december:12
};

function monthYear(v){

  const s=clean(v).replace(/_/g,' ');

  const m=s.match(
    /^([A-Za-z]+)[ -]?(20\d{2})$/
  );

  if(!m)return null;

  const mo=MONTHS[m[1].toLowerCase()];

  if(!mo)return null;

  return {
    month:mo,
    year:Number(m[2])
  };
}


/* =========================
   DATE
========================= */

function parseDate(v,context){

  const s=clean(v);

  if(!s)return null;

  let m=s.match(
    /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/
  );

  if(m){

    return {
      day:Number(m[1]),
      month:Number(m[2]),
      year:m[3].length===2
        ? 2000+Number(m[3])
        : Number(m[3])
    };

  }

  m=s.match(
    /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/
  );

  if(m){

    return {
      day:Number(m[3]),
      month:Number(m[2]),
      year:Number(m[1])
    };

  }

  m=s.match(
    /^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/
  );

  if(m){

    return {
      day:Number(m[3]),
      month:Number(m[2])+1,
      year:Number(m[1])
    };

  }

  m=s.match(
    /^(\d{1,2})[- ]([A-Za-z]+)$/
  );

  if(m && context){

    const mo=
      MONTHS[m[2].toLowerCase()];

    if(mo){

      return {
        day:Number(m[1]),
        month:mo,
        year:context.year
      };

    }

  }

  return null;
}


function fmtDate(d){

  if(!d)return '';

  return (
    String(d.day).padStart(2,'0')+
    '-' +
    String(d.month).padStart(2,'0')+
    '-' +
    d.year
  );
}


function dateSort(d){

  return (
    d.year*10000+
    d.month*100+
    d.day
  );

}


/* =========================
   ACTIVITY
========================= */

function activityName(v){

  const s=clean(v);
  const u=s.toUpperCase();

  if(!s)return '';

  if(
    u==='DAY' ||
    u==='D' ||
    s==='दिन'
  ){
    return 'दिन';
  }

  if(
    u==='NIGHT' ||
    u==='N' ||
    s==='रात'
  ){
    return 'रात';
  }

  if(
    u==='BEAS' ||
    s==='ब्यास'
  ){
    return 'ब्यास';
  }

  if(
    u.includes('SAHARANPUR') ||
    s.includes('सहारनपुर')
  ){
    return 'सहारनपुर';
  }

  if(
    u.includes('BANGALORE') ||
    s.includes('बैंगलोर')
  ){
    return 'बैंगलोर';
  }

  if(
    u.includes('PORT BLAIR') ||
    s.includes('पोर्ट ब्लेयर')
  ){
    return 'पोर्ट ब्लेयर';
  }

  if(
    u.includes('HUZUR DARSHAN') ||
    s.includes('हुजूर दर्शन')
  ){
    return 'हुजूर दर्शन';
  }

  if(
    u.includes('LIPAI') ||
    s.includes('लिपाई')
  ){
    return 'लिपाई';
  }

  return s;
}


/* =========================
   BADGE SEARCH
========================= */

function findBadge(rows,id){

  const target=norm(id);

  /* पहले Column A में खोजें */
  for(let r=0;r<rows.length;r++){

    if(
      norm(rows[r]?.[0])===target
    ){

      return {
        row:r
      };

    }

  }

  /* जरूरत पड़े तो पूरे sheet में खोजें */
  for(let r=0;r<rows.length;r++){

    for(
      let c=0;
      c<(rows[r]||[]).length;
      c++
    ){

      if(
        norm(rows[r][c])===target
      ){

        return {
          row:r
        };

      }

    }

  }

  return null;
}


/* =========================
   MAKE ATTENDANCE
========================= */

function makeRecord(rows,info){

  const badgeRow=info.row;

  const personRow=
    rows[badgeRow]||[];

  const monthRow=
    rows[0]||[];

  const dateRow=
    rows[1]||[];

  const activityRow=
    rows[2]||[];


  const name=
    clean(personRow[1]);

  const parent=
    clean(personRow[2]);


  const result=[];

  let monthContext=null;

  let currentDate=null;


  /*
    Sheet structure:

    Row 1 = Month
    Row 2 = Date
    Row 3 = Activity
    Row 4+ = Sewadar
  */


  const max=Math.max(
    monthRow.length,
    dateRow.length,
    activityRow.length,
    personRow.length
  );


  for(
    let c=0;
    c<max;
    c++
  ){

    /* Month */
    const m=
      monthYear(
        monthRow[c]
      );

    if(m){
      monthContext=m;
    }


    /* Date */
    const d=
      parseDate(
        dateRow[c],
        monthContext
      );

    if(d){
      currentDate=d;
    }


    /*
      A = Badge
      B = Name
      C = F/H
      D = blank
      E onward = Attendance
    */

    if(c<4){
      continue;
    }


    if(!currentDate){
      continue;
    }


    const raw=
      clean(personRow[c]);


    if(raw===''){
      continue;
    }


    /*
      Attendance can be:
      1
      2
      3
      etc.
    */

    const count=
      Number(
        raw.replace(/,/g,'')
      );


    if(
      !Number.isFinite(count) ||
      count<=0
    ){
      continue;
    }


    /*
      IMPORTANT:
      Activity उसी column से आएगी
    */

    const rawActivity=
      activityRow[c] ?? '';


    let activity=
      activityName(
        rawActivity
      );


    /*
      अगर Activity खाली है,
      attendance फिर भी नहीं छोड़ेंगे
    */

    if(!activity){

      activity='अन्य';

    }


    /*
      अगर special activity में
      LIPAI है और ऊपर DAY/NIGHT है
      तो दोनों जोड़ें
    */

    const rawSpecial=
      rows[3]?.[c] ?? '';

    const special=
      activityName(rawSpecial);


    if(
      special &&
      special!=='दिन' &&
      special!=='रात' &&
      special!=='ब्यास' &&
      special!==activity
    ){

      if(
        (activity==='दिन' ||
         activity==='रात') &&
        special==='लिपाई'
      ){

        activity=
          activity+' '+special;

      }

    }


    result.push({

      date:fmtDate(currentDate),

      sort:dateSort(currentDate),

      activity:activity,

      count:count,

      column:c

    });

  }


  /*
    Date के हिसाब से क्रम
  */

  result.sort((a,b)=>{

    if(a.sort!==b.sort){

      return a.sort-b.sort;

    }

    return a.column-b.column;

  });


  return {

    badge:clean(personRow[0]) || BADGE_ID,

    name:name,

    parent:parent,

    out:result

  };

}


/* =========================
   LOAD SHEET
========================= */

async function load(){

  const url=
    'https://docs.google.com/spreadsheets/d/' +
    SHEET_ID +
    '/gviz/tq?tqx=out:json&sheet=' +
    encodeURIComponent(SHEET_NAME) +
    '&t=' +
    Date.now();


  const response=
    await fetch(
      url,
      {
        cache:'no-store'
      }
    );


  if(!response.ok){

    throw new Error(
      'Google Sheet load failed'
    );

  }


  const text=
    await response.text();


  const rows=
    parseGViz(text);


  if(
    !rows ||
    !rows.length
  ){

    throw new Error(
      'Sheet data empty'
    );

  }


  return rows;

}


/* =========================
   RESULT
========================= */

function resultPage(rec){

  $('badge').textContent=
    rec.badge ||
    BADGE_ID ||
    '—';


  $('personName').textContent=
    rec.name ||
    '';


  $('parentName').textContent=
    rec.parent ||
    '';


  const list=
    $('dateList');


  if(
    !rec.out ||
    !rec.out.length
  ){

    $('status').textContent=
      'इस Badge ID की तारीख़वार हाज़री नहीं मिली।';

    $('status').className=
      'status err';

    list.innerHTML='';

    return;

  }


  $('status').textContent=
    rec.out.length+
    ' तारीख/गतिविधि की जानकारी मिली।';

  $('status').className=
    'status';


  list.innerHTML=
    rec.out.map(item=>`

      <div class="date-row">

        <div class="date-info">

          <div class="date">
            ${esc(item.date)}
          </div>

          <div class="activity">
            ${esc(item.activity)}
          </div>

        </div>

        <div class="count">
          ${esc(item.count)}
        </div>

      </div>

    `).join('');

}


/* =========================
   LOGO + WATERMARK
========================= */

async function loadBranding(){

  try{

    const response=
      await fetch(
        './index.html?t='+Date.now(),
        {
          cache:'no-store'
        }
      );


    if(!response.ok){
      return;
    }


    const html=
      await response.text();


    let match=
      html.match(
        /<img[^>]+src=["'](data:image\/png;base64,[A-Za-z0-9+/=]+)["']/i
      );


    if(!match){

      const fallback=
        html.match(
          /data:image\/png;base64,[A-Za-z0-9+/=]+/i
        );

      if(!fallback){
        return;
      }

      match=[
        null,
        fallback[0]
      ];

    }


    const image=
      match[1];


    $('topLogo').src=
      image;


    $('watermark').style.backgroundImage=
      'url("'+image+'")';

  }

  catch(error){

    console.log(
      'Branding load failed',
      error
    );

  }

}


/* =========================
   BACK
========================= */

$('backBtn').onclick=function(){

  history.back();

};


/* =========================
   START
========================= */

async function boot(){

  if(!BADGE_ID){

    $('status').textContent=
      'Badge ID नहीं मिला।';

    $('status').className=
      'status err';

    return;

  }


  loadBranding();


  try{

    const rows=
      await load();


    const info=
      findBadge(
        rows,
        BADGE_ID
      );


    if(!info){

      $('status').textContent=
        'इस Badge ID की जानकारी नहीं मिली।';

      $('status').className=
        'status err';

      return;

    }


    const rec=
      makeRecord(
        rows,
        info
      );


    resultPage(rec);

  }

  catch(error){

    console.error(
      error
    );


    $('status').textContent=
      'हाज़री की जानकारी लोड नहीं हो सकी।';

    $('status').className=
      'status err';

  }

}


boot();
</script>
</body>
