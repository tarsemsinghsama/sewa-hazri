<style>

.summary{position:relative;z-index:2;width:min(100% - 28px,560px);margin:25px auto 0;border:1px solid rgba(222,226,232,.9);border-radius:16px;background:rgba(255,255,255,.62);box-shadow:0 7px 24px rgba(25,37,52,.08);overflow:hidden;backdrop-filter:blur(1.2px)}.summary h2{margin:0;padding:19px 20px 13px;color:var(--maroon);font-size:24px;line-height:1.2}.status{position:relative;z-index:2;text-align:center;color:#687386;font-size:15px;padding:0 15px 14px}.status.err{color:#a32020}.date-list{border-top:1px solid rgba(218,223,229,.9)}.date-row{display:grid;grid-template-columns:1fr 82px;align-items:center;min-height:70px;padding:12px 18px;border-bottom:1px solid rgba(218,223,229,.9);background:rgba(255,255,255,.34)}.date-row:last-child{border-bottom:0}.date-info{min-width:0;text-align:left}.date{font-size:17px;font-weight:800;color:#303b4d;line-height:1.25}.activity{font-size:15px;color:#697386;font-weight:600;margin-top:3px}.count{text-align:right;font-size:27px;font-weight:850;color:var(--ink)}.empty{padding:20px 14px;text-align:center;color:var(--maroon);font-size:16px}.updated{text-align:center;position:relative;z-index:2;color:#687386;font-size:15px;margin:18px 12px 0}.calendar{font-size:18px;margin-right:7px}

<body>
<div class="page">
<div id="watermark" class="watermark"></div>
<header class="top"><img id="topLogo" class="top-logo" alt="RS SB"><div class="title">Sewadar Information Portal</div><div class="subtitle">सिकन्दरपुर</div></header>
<div class="result-top"><button type="button" class="back" id="backBtn"><span>‹</span>Back</button><div class="identity"><div id="badge" class="badge">—</div><div id="personName" class="person-name"></div><div id="parentName" class="parent-name"></div></div></div>
<section class="summary"><h2>तारीख़वार हाज़री</h2><div id="status" class="status">हाज़री की जानकारी लोड हो रही है...</div><div id="dateList" class="date-list"></div></section>
<div class="updated"><span class="calendar">▣</span>Live Data Updates</div><footer>Contact No.: +91 93156 64443</footer>
</div>

  <script>
const SHEET_ID='1H_TIjqyH_Hphcj315ZxAG52Jpoj7WF5TY5sl4DHSAs8';
const SHEET_NAME='MaleFemaleSKP';

const params=new URLSearchParams(location.search);
const BADGE_ID=(params.get('badge')||'').trim();

const $=id=>document.getElementById(id);


/* =========================
   BASIC
========================= */

function clean(v){
  return String(v??'')
    .replace(/\u00a0/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function norm(v){
  return clean(v)
    .toUpperCase()
    .replace(/[^A-Z0-9\u0900-\u097F]/g,'');
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}


/* =========================
   GOOGLE SHEET
========================= */

function parseGViz(text){

  const start=text.indexOf('{');
  const end=text.lastIndexOf('}');

  if(start<0 || end<0){
    throw new Error('Invalid Google Sheet response');
  }

  const json=JSON.parse(
    text.slice(start,end+1)
  );

  return (json.table?.rows||[]).map(row =>
    (row.c||[]).map(cell =>
      cell ? (cell.f ?? cell.v ?? '') : ''
    )
  );
}


/* =========================
   MONTH
========================= */

const MONTHS={
  jan:1,january:1,
  feb:2,february:2,
  mar:3,march:3,
  apr:4,april:4,
  may:5,
  jun:6,june:6,
  jul:7,july:7,
  aug:8,august:8,
  sep:9,sept:9,september:9,
  oct:10,october:10,
  nov:11,november:11,
  dec:12,december:12
};

function getMonthYear(v){

  const s=clean(v)
    .replace(/_/g,' ');

  const m=s.match(
    /^([A-Za-z]+)[ -]?(20\d{2})$/i
  );

  if(!m)return null;

  const mo=
    MONTHS[m[1].toLowerCase()];

  if(!mo)return null;

  return {
    month:mo,
    year:Number(m[2])
  };
}


/* =========================
   DATE
========================= */

function getDate(v,context){

  const s=clean(v);

  if(!s)return null;


  /* 07-10-2025 */
  let m=s.match(
    /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/
  );

  if(m){

    return {
      day:Number(m[1]),
      month:Number(m[2]),
      year:m[3].length===2
        ? 2000+Number(m[3])
        : Number(m[3])
    };

  }


  /* 2025-10-07 */
  m=s.match(
    /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/
  );

  if(m){

    return {
      day:Number(m[3]),
      month:Number(m[2]),
      year:Number(m[1])
    };

  }


  /* Date(2025,9,7) */
  m=s.match(
    /^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/
  );

  if(m){

    return {
      day:Number(m[3]),
      month:Number(m[2])+1,
      year:Number(m[1])
    };

  }


  /* 07-Oct */
  m=s.match(
    /^(\d{1,2})[- ]([A-Za-z]+)$/i
  );

  if(m && context){

    const mo=
      MONTHS[m[2].toLowerCase()];

    if(mo){

      return {
        day:Number(m[1]),
        month:mo,
        year:context.year
      };

    }

  }

  return null;
}


function formatDate(d){

  if(!d)return '';

  return (
    String(d.day).padStart(2,'0')+
    '-' +
    String(d.month).padStart(2,'0')+
    '-' +
    String(d.year)
  );
}


function sortDate(d){

  return (
    d.year*10000+
    d.month*100+
    d.day
  );
}


/* =========================
   ACTIVITY
========================= */

function activity(v){

  const s=clean(v);
  const u=s.toUpperCase();

  if(!s)return '';


  if(
    u==='DAY' ||
    u==='D' ||
    s==='दिन'
  ){
    return 'दिन';
  }


  if(
    u==='NIGHT' ||
    u==='N' ||
    s==='रात'
  ){
    return 'रात';
  }


  if(
    u==='BEAS' ||
    s==='ब्यास'
  ){
    return 'ब्यास';
  }


  if(
    u.includes('SAHARANPUR') ||
    s.includes('सहारनपुर')
  ){
    return 'सहारनपुर';
  }


  if(
    u.includes('BANGALORE') ||
    s.includes('बैंगलोर')
  ){
    return 'बैंगलोर';
  }


  if(
    u.includes('PORT BLAIR') ||
    s.includes('पोर्ट ब्लेयर')
  ){
    return 'पोर्ट ब्लेयर';
  }


  if(
    u.includes('HUZUR DARSHAN') ||
    s.includes('हुजूर दर्शन')
  ){
    return 'हुजूर दर्शन';
  }


  if(
    u.includes('LIPAI') ||
    s.includes('लिपाई')
  ){
    return 'लिपाई';
  }


  return s;
}


/* =========================
   CHECK ACTIVITY
========================= */

function isActivity(v){

  const s=clean(v).toUpperCase();

  return (
    s==='DAY' ||
    s==='D' ||
    s==='NIGHT' ||
    s==='N' ||
    s==='BEAS' ||
    s==='दिन' ||
    s==='रात' ||
    s==='ब्यास' ||
    s.includes('LIPAI') ||
    s.includes('SAHARANPUR') ||
    s.includes('BANGALORE') ||
    s.includes('PORT BLAIR') ||
    s.includes('HUZUR DARSHAN') ||
    s.includes('लिपाई') ||
    s.includes('सहारनपुर')
  );
}


/* =========================
   FIND HEADER ROWS
========================= */

function findHeaderRows(rows){

  let bestDateRow=-1;
  let bestDateCount=0;

  /*
    पहले 15 rows में Date वाली row खोजें
  */

  const limit=
    Math.min(rows.length,15);


  for(let r=0;r<limit;r++){

    let count=0;

    let context=null;

    /*
      उसी से पहले Month खोजें
    */

    for(let p=0;p<r;p++){

      for(
        let c=0;
        c<(rows[p]||[]).length;
        c++
      ){

        const m=
          getMonthYear(
            rows[p][c]
          );

        if(m){
          context=m;
        }

      }

    }


    for(
      let c=0;
      c<(rows[r]||[]).length;
      c++
    ){

      if(
        getDate(
          rows[r][c],
          context
        )
      ){

        count++;

      }

    }


    if(count>bestDateCount){

      bestDateCount=count;
      bestDateRow=r;

    }

  }


  /*
    Date row के ठीक बाद Activity row
    खोजें।
  */

  let activityRow=-1;

  if(bestDateRow>=0){

    let bestActivityCount=0;

    for(
      let r=bestDateRow+1;
      r<=bestDateRow+3 &&
      r<rows.length;
      r++
    ){

      let count=0;

      for(
        let c=0;
        c<(rows[r]||[]).length;
        c++
      ){

        if(
          isActivity(rows[r][c])
        ){

          count++;

        }

      }

      if(count>bestActivityCount){

        bestActivityCount=count;
        activityRow=r;

      }

    }

  }


  return {
    dateRow:bestDateRow,
    activityRow:activityRow
  };
}


/* =========================
   FIND BADGE
========================= */

function findBadge(rows,id){

  const target=norm(id);


  /*
    पहले Column A
  */

  for(
    let r=0;
    r<rows.length;
    r++
  ){

    if(
      norm(rows[r]?.[0])===target
    ){

      return {
        row:r
      };

    }

  }


  /*
    जरूरत पड़ने पर पूरा sheet
  */

  for(
    let r=0;
    r<rows.length;
    r++
  ){

    for(
      let c=0;
      c<(rows[r]||[]).length;
      c++
    ){

      if(
        norm(rows[r][c])===target
      ){

        return {
          row:r
        };

      }

    }

  }


  return null;
}


/* =========================
   MAKE RECORD
========================= */

function makeRecord(rows,info){

  const badgeRow=info.row;
  const personRow=rows[badgeRow]||[];

  const headers=findHeaderRows(rows);

  const dateRowIndex=headers.dateRow;
  const activityRowIndex=headers.activityRow;

  const record={
    badge:clean(personRow[0])||BADGE_ID,
    name:clean(personRow[1]),
    parent:clean(personRow[2]),
    out:[]
  };

  if(dateRowIndex<0 || activityRowIndex<0){
    return record;
  }

  const dateRow=rows[dateRowIndex]||[];
  const activityRow=rows[activityRowIndex]||[];

  /*
    Sheet में Month/Year ऊपर की row में हो सकता है।
    इसलिए हर column के लिए उसका Month/Year सुरक्षित रखें।
  */

  const columnMonth={};
  let lastMonth=null;

  for(let r=0;r<dateRowIndex;r++){

    const row=rows[r]||[];

    for(let c=0;c<row.length;c++){

      const m=getMonthYear(row[c]);

      if(m){
        columnMonth[c]=m;
        lastMonth=m;
      }
    }
  }


  let currentDate=null;

  const max=Math.max(
    dateRow.length,
    activityRow.length,
    personRow.length
  );


  for(let c=4;c<max;c++){

    const monthContext=
      columnMonth[c]||lastMonth;


    /*
      इस column की तारीख
    */

    const d=getDate(
      dateRow[c],
      monthContext
    );


    /*
      तारीख मिली तो आगे की columns के लिए
      वही तारीख जारी रहेगी।
    */

    if(d){
      currentDate=d;
    }


    if(!currentDate){
      continue;
    }


    /*
      इस Badge की attendance
    */

    const raw=clean(personRow[c]);

    if(!raw){
      continue;
    }


    const count=Number(
      raw.replace(/,/g,'')
    );


    if(
      !Number.isFinite(count) ||
      count<=0
    ){
      continue;
    }


    /*
      उसी column की activity
    */

    let act=activity(
      activityRow[c]
    );


    if(!act){
      act='अन्य';
    }


    record.out.push({

      date:formatDate(currentDate),

      sort:sortDate(currentDate),

      activity:act,

      count:count,

      column:c

    });

  }


  /*
    तारीख के क्रम में
  */

  record.out.sort((a,b)=>{

    if(a.sort!==b.sort){
      return a.sort-b.sort;
    }

    return a.column-b.column;

  });


  return record;
}

/* =========================
   LOAD SHEET
========================= */

async function load(){

  const url=
    'https://docs.google.com/spreadsheets/d/' +
    SHEET_ID +
    '/gviz/tq?tqx=out:json&sheet=' +
    encodeURIComponent(SHEET_NAME) +
    '&t=' +
    Date.now();


  const response=
    await fetch(
      url,
      {
        cache:'no-store'
      }
    );


  if(!response.ok){

    throw new Error(
      'Google Sheet load failed'
    );

  }


  const text=
    await response.text();


  return parseGViz(text);

}


/* =========================
   DISPLAY
========================= */

function resultPage(rec){

  $('badge').textContent=
    rec.badge ||
    BADGE_ID ||
    '—';


  $('personName').textContent=
    rec.name ||
    '';


  $('parentName').textContent=
    rec.parent ||
    '';


  const list=
    $('dateList');


  if(
    !rec.out ||
    !rec.out.length
  ){

    $('status').textContent=
      'इस Badge ID की तारीख़वार हाज़री नहीं मिली।';

    $('status').className=
      'status err';

    list.innerHTML='';

    return;

  }


  $('status').textContent=
    rec.out.length+
    ' तारीख/गतिविधि की जानकारी मिली।';

  $('status').className=
    'status';


  list.innerHTML=
    rec.out.map(item=>`

      <div class="date-row">

        <div class="date-info">

          <div class="date">
            ${esc(item.date)}
          </div>

          <div class="activity">
            ${esc(item.activity)}
          </div>

        </div>

        <div class="count">
          ${esc(item.count)}
        </div>

      </div>

    `).join('');

}


/* =========================
   LOGO + WATERMARK
========================= */

async function loadBranding(){

  try{

    const response=
      await fetch(
        './index.html?t='+Date.now(),
        {
          cache:'no-store'
        }
      );


    if(!response.ok)return;


    const html=
      await response.text();


    let match=
      html.match(
        /<img[^>]+src=["'](data:image\/png;base64,[A-Za-z0-9+/=]+)["']/i
      );


    if(!match){

      const fallback=
        html.match(
          /data:image\/png;base64,[A-Za-z0-9+/=]+/i
        );

      if(!fallback)return;

      match=[
        null,
        fallback[0]
      ];

    }


    const image=
      match[1];


    $('topLogo').src=
      image;


    $('watermark').style.backgroundImage=
      'url("'+image+'")';

  }

  catch(e){

    console.log(
      'Branding load failed',
      e
    );

  }

}


/* =========================
   BACK
========================= */

$('backBtn').onclick=()=>{

  history.back();

};


/* =========================
   START
========================= */

async function boot(){

  if(!BADGE_ID){

    $('status').textContent=
      'Badge ID नहीं मिला।';

    $('status').className=
      'status err';

    return;

  }


  loadBranding();


  try{

    const rows=
      await load();


    const info=
      findBadge(
        rows,
        BADGE_ID
      );


    if(!info){

      $('status').textContent=
        'इस Badge ID की जानकारी नहीं मिली।';

      $('status').className=
        'status err';

      return;

    }


    const rec=
      makeRecord(
        rows,
        info
      );


    resultPage(rec);

  }

  catch(error){

    console.error(error);


    $('status').textContent=
      'हाज़री की जानकारी लोड नहीं हो सकी।';

    $('status').className=
      'status err';

  }

}


boot();
</script>
