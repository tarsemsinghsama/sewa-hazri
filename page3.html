<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#760000">
<title>Sewadar Information Portal — सिकन्दरपुर</title>
<style>
:root{--maroon:#790000;--ink:#182235;--muted:#697386;--line:#dfe3e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Noto Sans",Arial,sans-serif;color:var(--ink);background:#fff}body{min-height:100vh}.page{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#fff}
.watermark{position:absolute;z-index:0;left:50%;top:52%;width:min(82vw,470px);height:min(82vw,470px);transform:translate(-50%,-50%);background-position:center;background-size:contain;background-repeat:no-repeat;opacity:.10;pointer-events:none}
.top{position:relative;z-index:2;text-align:center;padding:25px 18px 0}.top-logo{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 17px}.title{font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.5px}.subtitle{font-size:22px;line-height:1.2;color:#687284;margin-top:5px;font-weight:600}
.result-top{position:relative;z-index:2;padding:18px 18px 0}.back{border:0;background:transparent;color:var(--maroon);font-size:20px;font-weight:650;padding:5px 0;cursor:pointer}.back span{font-size:31px;vertical-align:-2px;margin-right:5px}.identity{text-align:center;margin-top:28px}.badge{font-size:24px;font-weight:850;letter-spacing:.2px;overflow-wrap:anywhere}.person-name{font-size:20px;font-weight:800;margin-top:5px}.parent-name{font-size:18px;color:#747d8c;margin-top:4px;font-weight:550}
.summary{position:relative;z-index:2;width:min(100% - 28px,560px);margin:25px auto 0;border:1px solid rgba(222,226,232,.9);border-radius:16px;background:rgba(255,255,255,.62);box-shadow:0 7px 24px rgba(25,37,52,.08);overflow:hidden;backdrop-filter:blur(1.2px)}.summary h2{margin:0;padding:19px 20px 13px;color:var(--maroon);font-size:24px;line-height:1.2}.status{position:relative;z-index:2;text-align:center;color:#687386;font-size:15px;padding:0 15px 14px}.status.err{color:#a32020}.date-list{border-top:1px solid rgba(218,223,229,.9)}.date-row{display:grid;grid-template-columns:1fr 82px;align-items:center;min-height:70px;padding:12px 18px;border-bottom:1px solid rgba(218,223,229,.9);background:rgba(255,255,255,.34)}.date-row:last-child{border-bottom:0}.date-info{min-width:0;text-align:left}.date{font-size:17px;font-weight:800;color:#303b4d;line-height:1.25}.activity{font-size:15px;color:#697386;font-weight:600;margin-top:3px}.count{text-align:right;font-size:27px;font-weight:850;color:var(--ink)}.empty{padding:20px 14px;text-align:center;color:var(--maroon);font-size:16px}.updated{text-align:center;position:relative;z-index:2;color:#687386;font-size:15px;margin:18px 12px 0}.calendar{font-size:18px;margin-right:7px}
footer{position:relative;z-index:10;text-align:center;padding:12px 12px 24px;margin-top:auto;color:var(--maroon);font-size:12px;font-weight:650;opacity:.60}footer:before,footer:after{content:"";display:inline-block;vertical-align:middle;width:68px;height:1px;background:currentColor;margin:0 18px 3px}
@media(max-width:520px){.top{padding-top:25px}.top-logo{width:56px;height:56px}.title{font-size:27px}.subtitle{font-size:22px}.identity{margin-top:28px}.badge{font-size:24px}.person-name{font-size:20px}.parent-name{font-size:18px}.summary h2{font-size:22px}.date-row{grid-template-columns:1fr 70px;min-height:68px;padding:11px 12px}.date{font-size:16px}.activity{font-size:14px}.count{font-size:25px}footer:before,footer:after{width:44px;margin:0 10px 3px}}
</style>
</head>
<body>
<div class="page">
<div id="watermark" class="watermark"></div>
<header class="top"><img id="topLogo" class="top-logo" alt="RS SB"><div class="title">Sewadar Information Portal</div><div class="subtitle">सिकन्दरपुर</div></header>
<div class="result-top"><button type="button" class="back" id="backBtn"><span>‹</span>Back</button><div class="identity"><div id="badge" class="badge">—</div><div id="personName" class="person-name"></div><div id="parentName" class="parent-name"></div></div></div>
<section class="summary"><h2>तारीख़वार हाज़री</h2><div id="status" class="status">हाज़री की जानकारी लोड हो रही है...</div><div id="dateList" class="date-list"></div></section>
<div class="updated"><span class="calendar">▣</span>Live Data Updates</div><footer>Contact No.: +91 93156 64443</footer>
</div>
<script>
const SHEET_ID='1H_TIjqyH_Hphcj315ZxAG52Jpoj7WF5TY5sl4DHSAs8';
const SHEET_NAME='MaleFemaleSKP';
const params=new URLSearchParams(location.search);
const BADGE_ID=(params.get('badge')||'').trim();
const $=id=>document.getElementById(id);
$('badge').textContent=BADGE_ID||'—';
function clean(v){return String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()}
function norm(v){return clean(v).toUpperCase().replace(/[^A-Z0-9\u0900-\u097F]/g,'')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function val(c){if(!c)return '';if(c.f!==undefined&&c.f!==null&&clean(c.f)!=='')return c.f;if(c.v!==undefined&&c.v!==null)return c.v;return ''}
function parseGViz(t){let a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw Error('Google Sheet response नहीं मिला');let j=JSON.parse(t.slice(a,b+1)),tab=j.table;if(!tab||!Array.isArray(tab.rows))throw Error('Google Sheet में data नहीं मिला');let n=(tab.cols||[]).length;return tab.rows.map(r=>{let x=new Array(n).fill('');(r.c||[]).forEach((c,i)=>{if(i<n)x[i]=val(c)});return x})}
const MONTHS={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
function isMonthYear(v){return /^(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER|JAN|FEB|MAR|APR|JUN|JUL|AUG|SEP|SEPT|OCT|NOV|DEC)[ _-]?(20\d{2})$/i.test(clean(v))}
function monthYear(v){let s=clean(v).replace(/_/g,' '),m=s.match(/^([A-Za-z]+)[ -]?(20\d{2})$/);if(!m)return null;let mo=MONTHS[m[1].toLowerCase()];return mo?{month:mo,year:Number(m[2])}:null}
function isDate(v){let s=clean(v);return /^\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4}$/.test(s)||/^\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2}$/.test(s)||/^Date\(\d{4},\d{1,2},\d{1,2}\)$/.test(s)||/^\d{1,2}[- ](?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)$/i.test(s)}
function fmtDate(v,context){let s=clean(v),m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);if(m)return m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+m[3];m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);if(m)return m[3].padStart(2,'0')+'-'+m[2].padStart(2,'0')+'-'+m[1];m=s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);if(m)return m[3].padStart(2,'0')+'-'+String(Number(m[2])+1).padStart(2,'0')+'-'+m[1];m=s.match(/^(\d{1,2})[- ]([A-Za-z]+)$/);if(m&&context){let mo=MONTHS[m[2].toLowerCase()];if(mo)return m[1].padStart(2,'0')+'-'+String(mo).padStart(2,'0')+'-'+context.year}return s}
function act(v){let s=clean(v),u=s.toUpperCase();if(u==='DAY'||u==='D'||s==='दिन')return'दिन';if(u==='NIGHT'||u==='N'||s==='रात')return'रात';if(u==='BEAS'||s==='ब्यास'||s==='ब्यास सेवा')return'ब्यास';if(u.includes('LIPAI')||s.includes('लिपाई'))return'लिपाई';if(u.includes('SAHARANPUR')||s.includes('सहारनपुर'))return'सहारनपुर';return s||'हाज़री'}
function findBadge(rows,id){let t=norm(id);for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++)if(norm(rows[r][c])===t)return{r,c};return null}
function findDateRow(rows,br){let best=-1,countBest=0;for(let r=0;r<br;r++){let n=rows[r].filter(isDate).length;if(n>countBest){countBest=n;best=r}}return best}
function findMonthRow(rows,dr){let best=-1,countBest=0;for(let r=0;r<dr;r++){let n=rows[r].filter(isMonthYear).length;if(n>countBest){countBest=n;best=r}}return best}
function make(rows,info){
  let br=info.r,bc=info.c,dr=findDateRow(rows,br),ar=dr>=0?dr+1:-1,brow=rows[br]||[];
  let mr=findMonthRow(rows,dr),monthContext=null;
  let name=bc===0?clean(brow[1]):clean(brow.find((v,i)=>i!==bc&&clean(v)));
  let parent=bc===0?clean(brow[2]):'';
  let out=[],current='',max=Math.max((rows[dr]||[]).length,(rows[ar]||[]).length,brow.length,(rows[mr]||[]).length);
  for(let c=0;c<max;c++){
    if(mr>=0 && isMonthYear(rows[mr]?.[c])) monthContext=monthYear(rows[mr][c]);
    const dateCell=rows[dr]?.[c]??'';
    if(isDate(dateCell)) current=fmtDate(dateCell,monthContext);
    if(!current)continue;
    let av=clean(rows[ar]?.[c]??'');
let raw=clean(brow[c]??'');

if(!isDate(dateCell) && !av && !raw) continue;

let n=Number(raw.replace(/,/g,''));

if(!Number.isFinite(n) || n<1) continue;

out.push({
  date:current,
  activity:act(av),
  count:n
});
  }
  return{name,parent,out}
}
async function load(){let u='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&sheet='+encodeURIComponent(SHEET_NAME)+'&t='+Date.now();let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('Google Sheet खुल नहीं रही');return parseGViz(await r.text())}
function render(a){$('dateList').innerHTML=a.length?a.map(x=>`<div class="date-row"><div class="date-info"><div class="date">${esc(x.date)}</div><div class="activity">${esc(x.activity)}</div></div><div class="count">${esc(x.count)}</div></div>`).join(''):'<div class="empty">इस Badge ID की तारीख़वार हाज़री नहीं मिली।</div>'}
async function logo(){try{let r=await fetch('./index.html?logo='+Date.now(),{cache:'no-store'});if(!r.ok)return;let h=await r.text(),m=h.match(/data:image\/png;base64,([A-Za-z0-9+/=]+)/);if(m){let s='data:image/png;base64,'+m[1];$('topLogo').src=s;$('watermark').style.backgroundImage='url("'+s+'")'}}catch(e){console.warn(e)}}
$('backBtn').onclick=()=>{location.href=BADGE_ID?'./index.html?badge='+encodeURIComponent(BADGE_ID):'./index.html'};
async function boot(){await logo();if(!BADGE_ID){$('status').textContent='Badge ID नहीं मिला।';$('status').className='status err';return}try{let rows=await load(),info=findBadge(rows,BADGE_ID);if(!info){$('status').textContent='यह Badge ID MaleFemaleSKP sheet में नहीं मिली।';$('status').className='status err';return}let d=make(rows,info);$('personName').textContent=d.name;$('parentName').textContent=d.parent;render(d.out);$('status').textContent=d.out.length+' तारीख़/गतिविधि की जानकारी मिली।'}catch(e){console.error(e);$('status').textContent='MaleFemaleSKP से हाज़री data load नहीं हो सका।';$('status').className='status err'}}
boot();
</script>
</body>
</html>
