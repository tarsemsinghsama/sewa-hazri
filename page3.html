<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sewadar Information Portal — सिकन्दरपुर</title>

<style>

:root{
  --maroon:#790000;
  --maroon2:#5f0000;
  --ink:#182235;
  --muted:#697386;
  --line:#dfe3e8;
  --gold:#f0d58a;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:var(--ink);
}

/* =========================
   WATERMARK
========================= */

.watermark{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(82vw,470px);
  height:min(82vw,470px);

  background-position:center;
  background-repeat:no-repeat;
  background-size:contain;

  opacity:.10;
  pointer-events:none;
  z-index:0;
}

/* =========================
   MAIN
========================= */

.page{
  position:relative;
  z-index:1;
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  padding:18px 16px 20px;
}

/* =========================
   HEADER
========================= */

.top{
  text-align:center;
  padding-top:4px;
}

.top-logo{
  width:112px;
  height:112px;
  object-fit:contain;
  display:block;
  margin:0 auto 8px;
}

.title{
  margin:0;
  color:var(--maroon);
  font-size:25px;
  font-weight:800;
  line-height:1.2;
}

.subtitle{
  margin-top:5px;
  font-size:17px;
  font-weight:700;
  color:var(--ink);
}

/* =========================
   NAVIGATION
========================= */

.nav{
  display:flex;
  gap:10px;
  margin:20px 0 16px;
}

.nav a{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;

  min-height:44px;
  padding:9px 10px;

  border:1px solid var(--maroon);
  border-radius:10px;

  background:#fff;
  color:var(--maroon);

  text-decoration:none;
  font-size:14px;
  font-weight:700;

  transition:.2s;
}

.nav a:hover{
  background:var(--maroon);
  color:#fff;
}

/* =========================
   CARD
========================= */

.card{
  position:relative;

  background:rgba(255,255,255,.94);

  border:1px solid var(--line);
  border-radius:16px;

  padding:18px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.07);
}

/* =========================
   BADGE
========================= */

.badge-box{
  text-align:center;
  margin-bottom:17px;
}

.badge-label{
  font-size:13px;
  color:var(--muted);
  margin-bottom:5px;
}

.badge{
  color:var(--maroon);
  font-size:21px;
  font-weight:800;
  letter-spacing:.4px;
}

/* =========================
   HEADING
========================= */

.heading{
  text-align:center;

  color:var(--maroon);

  font-size:22px;
  font-weight:800;

  margin:5px 0 17px;
}

/* =========================
   ATTENDANCE LIST
========================= */

.attendance-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.attendance-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  min-height:49px;

  padding:10px 13px;

  border:1px solid var(--line);
  border-radius:10px;

  background:#fff;
}

.attendance-name{
  color:var(--ink);
  font-size:15px;
  font-weight:700;
}

.attendance-count{
  min-width:43px;

  padding:6px 10px;

  text-align:center;

  border-radius:8px;

  background:#fff5f5;
  border:1px solid #ead0d0;

  color:var(--maroon);

  font-size:16px;
  font-weight:800;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:30px 10px;

  color:var(--muted);
  font-size:15px;
}

.spinner{
  width:30px;
  height:30px;

  margin:0 auto 12px;

  border:3px solid #eee;
  border-top-color:var(--maroon);

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   ERROR
========================= */

.message{
  padding:16px;

  border:1px solid #ead0d0;
  border-radius:10px;

  background:#fff8f8;

  color:var(--maroon);

  text-align:center;
  font-size:14px;
  line-height:1.6;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;

  margin-top:22px;
  padding-top:14px;

  border-top:1px solid var(--line);

  color:var(--muted);

  font-size:12px;
}

.footer strong{
  color:var(--maroon);
}

/* =========================
   MOBILE
========================= */

@media(max-width:520px){

  .page{
    padding:12px 11px 18px;
  }

  .top-logo{
    width:56px;
    height:56px;
    margin-bottom:6px;
  }

  .title{
    font-size:20px;
  }

  .subtitle{
    font-size:15px;
  }

  .nav{
    margin-top:15px;
    gap:7px;
  }

  .nav a{
    min-height:42px;
    padding:8px 5px;
    font-size:12px;
  }

  .card{
    padding:13px;
    border-radius:13px;
  }

  .heading{
    font-size:19px;
  }

  .attendance-name{
    font-size:14px;
  }

  .attendance-count{
    font-size:15px;
  }

}

</style>
</head>

<body>

<div class="watermark" id="watermark"></div>

<div class="page">

  <!-- HEADER -->
  <div class="top">

    <img
      id="topLogo"
      class="top-logo"
      alt="Logo"
    >

    <h1 class="title">
      Sewadar Information Portal
    </h1>

    <div class="subtitle">
      सिकन्दरपुर
    </div>

  </div>


  <!-- NAVIGATION -->
  <div class="nav">

    <a href="./">
      🏠 Home Page
    </a>

    <a id="back2">
      ⬅️ 2nd Page
    </a>

  </div>


  <!-- MAIN CARD -->
  <div class="card">

    <div class="badge-box">

      <div class="badge-label">
        Badge ID
      </div>

      <div
        class="badge"
        id="badgeNumber">
        —
      </div>

    </div>


    <div class="heading">
      तारीख़वार हाज़री
    </div>


    <div
      id="attendanceList"
      class="attendance-list">

      <div class="loading">

        <div class="spinner"></div>

        हाज़री लोड हो रही है...

      </div>

    </div>

  </div>


  <!-- FOOTER -->
  <div class="footer">

    Contact No.:
    <strong>+91 93156 64443</strong>

  </div>

</div>


<script>

/* =========================================================
   GOOGLE SHEET
   SAME SHEET USED FOR 2nd PAGE
   ========================================================= */

const GOOGLE_SHEET_ID =
  "1H_TIjqyH_Hphcj315ZxAG52Jpoj7WF5TY5sl4DHSAs8";

const GOOGLE_SHEET_NAME =
  "MaleFemaleSKP";


/* =========================================================
   GET BADGE FROM URL
   Example:
   page3.html?badge=SI5860LA0366
   ========================================================= */

const params =
  new URLSearchParams(location.search);

const badgeFromUrl =
  params.get("badge") || "";


/* =========================================================
   NORMALIZE
   ========================================================= */

function norm(value){

  return String(value ?? "")
    .trim()
    .replace(/\s+/g," ")
    .toUpperCase();

}


/* =========================================================
   DISPLAY VALUE
   ========================================================= */

function displayValue(cell){

  if(!cell) return "";

  if(cell.f !== undefined &&
     cell.f !== null &&
     String(cell.f).trim() !== ""){

    return String(cell.f).trim();

  }

  if(cell.v !== undefined &&
     cell.v !== null){

    return String(cell.v).trim();

  }

  return "";

}


/* =========================================================
   DATE DETECTION
   ========================================================= */

function extractDate(text){

  text = String(text || "").trim();

  /* dd-mm-yyyy / dd/mm/yyyy */
  let m =
    text.match(
      /(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/
    );

  if(m){

    let d =
      m[1].padStart(2,"0");

    let mo =
      m[2].padStart(2,"0");

    let y =
      m[3];

    if(y.length === 2){
      y = "20" + y;
    }

    return {
      date:`${d}-${mo}-${y}`,
      textWithoutDate:
        text.replace(m[0],"").trim()
    };

  }


  /* Google Date(2025,9,7) */
  m =
    text.match(
      /Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)/
    );

  if(m){

    const y = m[1];

    const mo =
      String(Number(m[2]) + 1)
        .padStart(2,"0");

    const d =
      String(m[3])
        .padStart(2,"0");

    return {
      date:`${d}-${mo}-${y}`,
      textWithoutDate:""
    };

  }

  return null;

}


/* =========================================================
   ACTIVITY TRANSLATION
   ========================================================= */

function translateActivity(text){

  let s =
    String(text || "")
      .trim();

  if(!s) return "";

  const upper =
    norm(s);

  if(
    upper === "DAY" ||
    upper === "दिन"
  ){
    return "दिन";
  }

  if(
    upper === "NIGHT" ||
    upper === "रात"
  ){
    return "रात";
  }

  if(
    upper === "BEAS" ||
    upper === "ब्यास"
  ){
    return "ब्यास";
  }

  if(
    upper === "LIPAI" ||
    upper === "LIPAAI" ||
    upper === "लिपाई"
  ){
    return "लिपाई";
  }

  if(
    upper === "SAHARANPUR" ||
    upper === "SAHARANPUR" ||
    upper === "सहारनपुर"
  ){
    return "सहारनपुर";
  }

  return s;

}


/* =========================================================
   CHECK ACTIVITY
   ========================================================= */

function isActivity(text){

  const s =
    norm(text);

  if(!s) return false;

  return [
    "DAY",
    "दिन",
    "NIGHT",
    "रात",
    "BEAS",
    "ब्यास",
    "LIPAI",
    "LIPAAI",
    "लिपाई",
    "SAHARANPUR",
    "सहारनपुर"
  ].includes(s);

}


/* =========================================================
   HEADER LABEL
   ========================================================= */

function makeHeaderLabel(
  row3Cell,
  row4Cell,
  previousDate
){

  const a =
    displayValue(row3Cell);

  const b =
    displayValue(row4Cell);

  let date =
    previousDate || "";

  let aText = a;
  let bText = b;


  const dateA =
    extractDate(aText);

  if(dateA){

    date =
      dateA.date;

    aText =
      dateA.textWithoutDate;

  }


  const dateB =
    extractDate(bText);

  if(dateB){

    date =
      dateB.date;

    bText =
      dateB.textWithoutDate;

  }


  aText =
    aText.trim();

  bText =
    bText.trim();


  let parts = [];


  if(aText){

    const translated =
      translateActivity(aText);

    if(
      isActivity(aText) ||
      isActivity(translated)
    ){

      parts.push(translated);

    }

  }


  if(bText){

    const translated =
      translateActivity(bText);

    if(
      isActivity(bText) ||
      isActivity(translated)
    ){

      if(
        !parts.some(
          x =>
          norm(x) ===
          norm(translated)
        )
      ){

        parts.push(translated);

      }

    }

  }


  if(!date && !parts.length){

    return {
      label:"",
      date:""
    };

  }


  let label = "";

  if(date){

    label += date;

  }

  if(parts.length){

    if(label){
      label += " ";
    }

    label += parts.join(" ");

  }


  return {
    label,
    date
  };

}


/* =========================================================
   FIND BADGE COLUMN
   ========================================================= */

function findBadgeColumn(rows){

  let bestColumn = -1;
  let bestCount = 0;


  if(!rows.length) return -1;


  const maxColumns =
    Math.max(
      ...rows.map(r => r.length)
    );


  for(
    let c=0;
    c<maxColumns;
    c++
  ){

    let count = 0;


    for(
      let r=0;
      r<rows.length;
      r++
    ){

      const value =
        norm(
          displayValue(rows[r][c])
        );


      if(
        /^SI[A-Z0-9-]+$/.test(value) ||
        /^SKP[A-Z0-9-]+$/.test(value)
      ){

        count++;

      }

    }


    if(count > bestCount){

      bestCount = count;
      bestColumn = c;

    }

  }


  return bestColumn;

}


/* =========================================================
   FIND USER ROW
   ========================================================= */

function findBadgeRow(
  rows,
  badgeColumn,
  badge
){

  const target =
    norm(badge);


  for(
    let r=0;
    r<rows.length;
    r++
  ){

    const value =
      norm(
        displayValue(
          rows[r][badgeColumn]
        )
      );


    if(value === target){

      return r;

    }

  }


  return -1;

}


/* =========================================================
   LOAD GOOGLE SHEET
   ========================================================= */

async function loadGoogleSheet(){

  const url =
    "https://docs.google.com/spreadsheets/d/" +
    GOOGLE_SHEET_ID +
    "/gviz/tq?tqx=out:json&sheet=" +
    encodeURIComponent(GOOGLE_SHEET_NAME);


  const response =
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "Google Sheet open नहीं हो सकी."
    );

  }


  const text =
    await response.text();


  const match =
    text.match(
      /google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/
    );


  if(!match){

    throw new Error(
      "Google Sheet का data format नहीं मिला."
    );

  }


  return JSON.parse(match[1]);

}


/* =========================================================
   GET ROWS
   ========================================================= */

function getRows(data){

  const table =
    data.table;


  const rows = [];


  for(
    const row of table.rows
  ){

    const cells = [];


    for(
      let i=0;
      i<table.cols.length;
      i++
    ){

      cells.push(
        row.c && row.c[i]
          ? row.c[i]
          : {
              v:"",
              f:""
            }
      );

    }


    rows.push(cells);

  }


  return rows;

}


/* =========================================================
   BUILD ATTENDANCE
   ========================================================= */

function buildAttendance(
  rows,
  badge
){

  const badgeColumn =
    findBadgeColumn(rows);


  if(badgeColumn < 0){

    throw new Error(
      "Badge ID वाला column नहीं मिला."
    );

  }


  const badgeRow =
    findBadgeRow(
      rows,
      badgeColumn,
      badge
    );


  if(badgeRow < 0){

    return [];

  }


  /*
    User के बताए अनुसार:
    Row 3 = date/activity
    Row 4 = extra activity
  */

  const row3 =
    rows[2] || [];

  const row4 =
    rows[3] || [];

  const dataRow =
    rows[badgeRow] || [];


  const maxColumns =
    Math.max(
      row3.length,
      row4.length,
      dataRow.length
    );


  const result = [];

  let currentDate = "";


  for(
    let c=0;
    c<maxColumns;
    c++
  ){

    /*
      Badge/name/other columns को छोड़ें
    */
    if(c === badgeColumn){
      continue;
    }


    const header =
      makeHeaderLabel(
        row3[c],
        row4[c],
        currentDate
      );


    if(header.date){

      currentDate =
        header.date;

    }


    if(!header.label){

      continue;

    }


    /*
      केवल date/activity वाले columns
    */
    const hasDate =
      !!header.date;

    const hasActivity =
      header.label
        .split(" ")
        .some(
          part =>
          isActivity(part)
        );


    if(!hasDate && !hasActivity){

      continue;

    }


    const cell =
      dataRow[c];


    const value =
      displayValue(cell);


    /*
      खाली cell skip
    */
    if(value === ""){

      continue;

    }


    /*
      संख्या/attendance value
    */
    const numeric =
      Number(
        String(value)
          .replace(/,/g,"")
          .trim()
      );


    if(
      Number.isNaN(numeric)
    ){

      continue;

    }


    result.push({
      label:header.label,
      count:value
    });

  }


  return result;

}


/* =========================================================
   RENDER
   ========================================================= */

function renderAttendance(
  items
){

  const box =
    document.getElementById(
      "attendanceList"
    );


  if(!items.length){

    box.innerHTML = `
      <div class="message">
        इस Badge ID की तारीख़वार हाज़री नहीं मिली।
      </div>
    `;

    return;

  }


  box.innerHTML =
    items.map(
      item => `

        <div class="attendance-row">

          <div class="attendance-name">
            ${escapeHtml(item.label)}
          </div>

          <div class="attendance-count">
            ${escapeHtml(item.count)}
          </div>

        </div>

      `
    ).join("");

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   SAME LOGO FROM ORIGINAL index.html
   ========================================================= */

async function loadOriginalLogo(){

  try{

    const response =
      await fetch(
        "./index.html",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){
      return;
    }


    const html =
      await response.text();


    const match =
      html.match(
        /data:image\/(?:png|jpeg|jpg);base64,[A-Za-z0-9+/=]+/
      );


    if(!match){
      return;
    }


    const logo =
      match[0];


    document
      .getElementById("topLogo")
      .src = logo;


    document
      .getElementById("watermark")
      .style
      .backgroundImage =
        `url("${logo}")`;

  }
  catch(error){

    /*
      Logo load fail होने पर
      page फिर भी काम करता रहेगा।
    */

    console.log(
      "Original logo load failed",
      error
    );

  }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

async function init(){

  const badge =
    badgeFromUrl.trim();


  document
    .getElementById("badgeNumber")
    .textContent =
      badge || "—";


  /*
    2nd page link
  */

  const back =
    document.getElementById(
      "back2"
    );


  if(badge){

    back.href =
      "./?badge=" +
      encodeURIComponent(badge);

  }
  else{

    back.href =
      "./";

  }


  /*
    Original logo
  */

  loadOriginalLogo();


  /*
    Badge नहीं मिला
  */

  if(!badge){

    document
      .getElementById(
        "attendanceList"
      )
      .innerHTML = `
        <div class="message">
          Badge ID नहीं मिला।<br>
          कृपया 2nd Page से तारीख़वार हाज़री खोलें।
        </div>
      `;

    return;

  }


  try{

    const data =
      await loadGoogleSheet();


    const rows =
      getRows(data);


    const attendance =
      buildAttendance(
        rows,
        badge
      );


    renderAttendance(
      attendance
    );

  }
  catch(error){

    console.error(error);


    document
      .getElementById(
        "attendanceList"
      )
      .innerHTML = `
        <div class="message">
          Google Sheet से data लोड नहीं हो पाया।<br><br>
          कृपया सुनिश्चित करें कि
          <b>MaleFemaleSKP</b> sheet
          देखने के लिए उपलब्ध है।
        </div>
      `;

  }

}


/* =========================================================
   START
   ========================================================= */

init();

</script>

</body>
</html>
