name: Update attendance data

on:
  workflow_dispatch:
  schedule:
    # हर 10 मिनट में OneDrive Excel से FINAL sheet पढ़कर data.json अपडेट होगा.
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Download Excel and rebuild data.json
        run: python update_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No attendance changes."
          else
            git commit -m "Auto update attendance data"
            git push
          fi
